[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clip2trace"
version = "0.1.0"
description = "Telegram source tracing for reused footage in edited videos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "dirstral" }]

# Baseline runtime deps. NOTE: inside Sinas, function dependencies must be
# admin-approved (spec.dependencies in sinas-package.yaml). See docs/sinas-setup.md.
# Heavy deps (torch/CLIP/FAISS/Whisper/EasyOCR) are intentionally EXCLUDED; see docs/risks.md
# and the stretch issues before adding any of them.
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "imagehash>=4.3",
    "rapidfuzz>=3.0",
    "python-dateutil>=2.8",
    "requests>=2.31",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# Installed locally for development; in Sinas these map to approved spec.dependencies.
video = [
    # PyAV is the self-contained decode path: its manylinux wheel bundles ffmpeg,
    # so keyframe extraction + shot detection work on minimal workers (no system
    # libGL/ffmpeg). opencv/scenedetect are the preferred path when present.
    "av>=11",
    "opencv-python-headless>=4.8",
    "scenedetect>=0.6",
]
telegram = [
    "telethon>=1.34",
]
# Operator-provisioned local OCR upgrade (#27). EasyOCR pulls in torch and ~64 MB
# of detection/recognition weights, so it does NOT fit the 512 MB pip-only worker
# — it is a local-only option. Deliberately NOT in `dev` (CI installs `dev`).
# On the managed worker, Claude-vision (src/clip2trace/ocr.py) is the default.
ocr = [
    "easyocr>=1.7",
]
# OPTIONAL visual-embedding upgrade path (clip2trace.matching.load_clip_embedder).
# Heavy (torch is ~1-2 GB) — does NOT fit the pip-only / 512 MB Sinas worker, so
# this is operator-provisioned / local-only and phash stays the worker default.
# Deliberately NOT in `dev`: CI installs `dev`, and pulling torch would blow up
# install time/size. Tests that need the real model use pytest.importorskip.
# See docs/risks.md ("Visual embedding similarity").
embeddings = [
    "open-clip-torch>=2.20",
    "torch>=2.0",
]
# Optional ASR / transcript extraction (spoken context for query planning).
# HEAVY + operator-provisioned/local only — faster-whisper pulls in the
# CTranslate2 native runtime (+ onnxruntime) and a multi-hundred-MB model (no
# torch; that's the openai-whisper path), and will NOT run on the pip-only 512 MB
# / 300 s Sinas worker (see docs/risks.md, row 14). Never add this to `dev`: CI
# installs `dev` and must stay light. Absent this extra, extract_transcript()="".
asr = [
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# ── Formatting / linting / typing ──────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
# Lint everything except vendored skill dirs.
extend-exclude = [".claude"]

[tool.ruff.lint]
# pycodestyle errors+warnings, pyflakes, isort, bugbear, comprehensions, and
# single-line implicit string concat. (pyupgrade `UP` deferred — it rewrites all
# the typing hints; adopt separately.)
select = ["E", "F", "W", "I", "B", "C4", "ISC001"]
# E501 (line length) is owned by black.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests favour terse fixtures and re-import helpers; relax a couple of rules.
"tests/*" = ["B011"]

[tool.mypy]
# Type-check the reusable library only. functions/ are dynamic Sinas handlers and
# the sandbox can't import the package anyway; tests are dynamic by design.
files = ["src/clip2trace"]
python_version = "3.10"
ignore_missing_imports = true       # optional deps (telethon, cv2, av, imagehash…)
no_implicit_optional = true
# `# type: ignore` on optional-dep imports is intentional, so don't flag it unused
# (ignore_missing_imports already silences those import errors).
warn_unused_ignores = false
