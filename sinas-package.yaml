apiVersion: sinas.co/v1
kind: SinasPackage
package:
  name: clip2trace
  version: "0.1.0"
  description: Telegram source tracing for reused footage in edited videos.
  author: dirstral
  url: https://github.com/dirstral/clip2trace

# ---------------------------------------------------------------------------
# NOTE on inferred field names:
#   The Sinas package-author skill ships verbatim YAML only for functions,
#   agents, queries, connectors, variables and manifests. The field names used
#   below for collections / stores / components are the camelCase form of the
#   documented (snake_case) API properties and have NOT been seen in a verbatim
#   package example. `sinas validate` against the live instance is the source of
#   truth — see docs/research/sinas-investigation.md. Unknown keys are rejected
#   by the strict schema, so adjust here if validation complains.
# ---------------------------------------------------------------------------

spec:
  variables:
    - name: PRIMARY_LLM
      type: resource_ref
      resource: llm_providers
      description: Claude provider used by all clip2trace agents.
      required: true
    - name: ENABLE_TELEGRAM_LIVE_SEARCH
      type: boolean
      description: Enable live global Telegram search via Telethon. Default off (demo mode).
      default: false
      required: false
    - name: MAX_VIDEO_MB
      type: text
      description: Soft cap on input video size in MB. (No numeric var type; stored as text.)
      default: "500"
      required: false
    - name: TELEGRAM_API_ID
      type: secret
      description: Telegram API id (my.telegram.org). Required only when live search is enabled.
      required: false
    - name: TELEGRAM_API_HASH
      type: secret
      description: Telegram API hash. Required only when live search is enabled.
      required: false
    - name: TELEGRAM_SESSION_STRING
      type: secret
      description: Telethon StringSession for a USER account. Required only when live search is enabled.
      required: false
    - name: TELEGRAM_SEARCH_API_URL
      type: text
      description: Base URL of an optional managed Telegram search API (issue #28 fallback adapter). Leave blank to disable.
      required: false
    - name: TELEGRAM_SEARCH_API_KEY
      type: secret
      description: API key for the optional managed Telegram search fallback (used only if TELEGRAM_SEARCH_API_URL is set).
      required: false

  collections:
    - namespace: clip2trace
      name: input-videos
      metadataSchema:
        type: object
        properties:
          job_id: { type: string }
          duration_sec: { type: number }
    - namespace: clip2trace
      name: source-segments
      metadataSchema:
        type: object
        properties:
          job_id: { type: string }
          segment_id: { type: string }
    - namespace: clip2trace
      name: keyframes
      metadataSchema:
        type: object
        properties:
          segment_id: { type: string }
    - namespace: clip2trace
      name: telegram-media
      metadataSchema:
        type: object
        properties:
          candidate_id: { type: string }
    - namespace: clip2trace
      name: reports
      metadataSchema:
        type: object
        properties:
          job_id: { type: string }
    - namespace: clip2trace
      name: demo-fixtures
      metadataSchema:
        type: object
        properties:
          fixture: { type: string }

  stores:
    - namespace: clip2trace
      name: jobs
      description: Job records keyed by job_id (status, progress, input metadata, errors).
      visibility: shared
    - namespace: clip2trace
      name: segments
      description: Candidate source segments per job.
      visibility: shared
    - namespace: clip2trace
      name: search-results
      description: Telegram search hits per query.
      visibility: shared
    - namespace: clip2trace
      name: candidate-matches
      description: Media-similarity match results per candidate.
      visibility: shared
    - namespace: clip2trace
      name: query-cache
      description: Cached Telegram query->results to avoid repeated live searches.
      visibility: shared
    - namespace: clip2trace
      name: runtime-diagnostics
      description: Output of diagnose_runtime capability probes.
      visibility: shared

  functions:
    - namespace: clip2trace
      name: create_job
      description: Create a source-tracing job for one input video.
      timeout: 30
      inputSchema:
        type: object
        properties:
          input_video_file_id: { type: string }
          video_context: { type: string }
          date_hint: { type: string }
          language_hint: { type: string }
          topic_hint: { type: string }
          mode: { type: string, enum: [demo, live, hybrid], default: demo }
      code: |
        def handler(input_data, context):
            mode = input_data.get("mode", "demo")
            if mode not in ("demo", "live", "hybrid"):
                return {"error": "mode must be demo|live|hybrid"}
            exec_id = (context or {}).get("execution_id", "local")
            job_id = "job_" + str(exec_id)
            meta_fields = ("input_video_file_id", "video_context", "date_hint",
                           "language_hint", "topic_hint")
            state = {"job_id": job_id, "status": "created", "mode": mode,
                     "progress": 0.0, "error": None,
                     "next_step": "analyze_input_video"}
            for k in meta_fields:
                state[k] = input_data.get(k)
            return state

    - namespace: clip2trace
      name: diagnose_runtime
      description: Probe runtime capabilities (libs, tools, disk, secrets access).
      sharedPool: true
      timeout: 30
      inputSchema:
        type: object
        properties: {}
      code: |
        def handler(input_data, context):
            import importlib, shutil, sys, tempfile, os
            def has_mod(m):
                try:
                    importlib.import_module(m); return True
                except Exception:
                    return False
            tmp = tempfile.gettempdir()
            try:
                free = shutil.disk_usage(tmp).free
            except Exception:
                free = None
            return {
                "python": sys.version.split()[0],
                "modules": {m: has_mod(m) for m in
                            ["av", "cv2", "scenedetect", "imagehash", "PIL",
                             "numpy", "telethon", "rapidfuzz", "dateutil",
                             "requests", "sinas"]},
                "tools": {"ffmpeg": bool(shutil.which("ffmpeg")),
                          "tesseract": bool(shutil.which("tesseract"))},
                "tmp_dir": tmp, "tmp_free_bytes": free,
                "has_access_token": bool((context or {}).get("access_token")),
                "secrets_available": "secrets" in (context or {}),
                "env_keys": sorted(os.environ.keys()),
                "context_keys": sorted((context or {}).keys()),
            }

    - namespace: clip2trace
      name: analyze_input_video
      description: High-level orchestration of input-video analysis into source segments.
      timeout: 300
      inputSchema:
        type: object
        properties:
          job_id: { type: string }
          input_video_file_id: { type: string }
          video_path: { type: string }
          duration_sec: { type: number }
          mode: { type: string, default: demo }
        required: [job_id]
      code: |
        def _stage_input_video(file_id, context, cache_key=None):
            # Download an uploaded clip2trace/input-videos file to /tmp so PyAV can
            # decode it. The runtime base URL is the sinas SDK default
            # (host.docker.internal:8000), NOT in env/context — see
            # docs/research/runtime-diagnostics.md. Bounded to ~90 MB (100 MB /tmp).
            import os, base64, tempfile
            def _safe_cache_part(value):
                text = str(value or "")
                cleaned = "".join(
                    ch if ch.isalnum() or ch in "._-" else "_" for ch in text)
                return cleaned.strip("._") or "scope"
            context = context or {}
            token = context.get("access_token")
            if not file_id or not token:
                return None
            base = (context.get("api_url") or context.get("base_url")
                    or os.environ.get("SINAS_BASE_URL")
                    or "http://host.docker.internal:8000").rstrip("/")
            # The files API is name-addressed and returns a JSON envelope
            # {content_base64, content_type, ...} — decode it to a local file.
            from urllib.parse import quote
            url = "%s/files/clip2trace/input-videos/%s" % (
                base, quote(str(file_id), safe=""))
            name = os.path.basename(str(file_id))
            cap = 90 * 1024 * 1024
            path = os.path.join(
                tempfile.gettempdir(),
                "clip2trace",
                "input-videos",
                "user_" + _safe_cache_part(context.get("user_id")),
                "job_" + _safe_cache_part(cache_key),
                name if "." in name else name + ".mp4")
            try:
                if os.path.exists(path) and not os.path.isfile(path):
                    return None
                if os.path.isfile(path):
                    size = os.path.getsize(path)
                    if 0 < size <= cap:
                        return path  # reuse already-staged copy within this job
            except OSError:
                pass
            try:
                import requests
                resp = requests.get(
                    url, timeout=120,
                    headers={"Authorization": "Bearer %s" % token})
                if resp.status_code != 200:
                    return None
                b64 = (resp.json() or {}).get("content_base64")
                if not b64 or (len(b64) * 3) // 4 > cap:
                    return None
                raw = base64.b64decode(b64)
                if len(raw) > cap:
                    return None
                os.makedirs(os.path.dirname(path), exist_ok=True)
                with open(path, "wb") as fh:
                    fh.write(raw)
                return path
            except Exception:
                return None

        def handler(input_data, context):
            job_id = input_data.get("job_id")
            if not job_id:
                return {"error": "job_id is required"}
            mode = input_data.get("mode", "demo")
            video_path = input_data.get("video_path")
            duration = input_data.get("duration_sec")
            diagnostics = []
            segments, method = [], "demo_fixture"

            file_id = input_data.get("input_video_file_id")
            if not video_path and file_id:
                video_path = _stage_input_video(file_id, context, job_id)
                diagnostics.append(
                    ("staged input video %s" % file_id) if video_path
                    else ("input video %s could not be staged" % file_id))

            def windows_to_segments(wins, likelihood, reason):
                return [{"segment_id": "seg_%03d" % i,
                         "start_sec": round(float(w["start_sec"]), 2),
                         "end_sec": round(float(w["end_sec"]), 2),
                         "source_likelihood": likelihood, "reason": reason}
                        for i, w in enumerate(wins, 1)]

            if video_path:
                try:
                    from scenedetect import detect, ContentDetector
                    scenes = detect(video_path, ContentDetector())
                    def _secs(tc):
                        return tc.seconds if hasattr(tc, "seconds") else tc.get_seconds()
                    wins = [{"start_sec": _secs(s), "end_sec": _secs(e)}
                            for s, e in scenes]
                    segments = windows_to_segments(
                        wins, 0.5, "shot boundary; candidate reused footage")
                    method = "shot_detection"
                except Exception as exc:
                    diagnostics.append("shot detection unavailable: %r" % (exc,))
                if not segments:
                    try:
                        import av, numpy as np
                        # Color-histogram shot detection: a static overlay cancels in
                        # the histogram diff (unlike a grayscale pixel mean, which it
                        # dilutes), and color separates same-luma scenes.
                        def _feat(im):
                            sc = max(1, int(max(im.shape[:2]) / 128))
                            s = im[::sc, ::sc]; out = []
                            for ch in range(3):
                                h, _e = np.histogram(s[:, :, ch], bins=16, range=(0, 255))
                                h = h.astype("float32"); tot = h.sum()
                                out.append(h / tot if tot else h)
                            return out
                        c = av.open(video_path)
                        try:
                            vs = c.streams.video[0]; tb = vs.time_base
                            prev = None; last = 0.0; nxt = 0.0; ts = []; ds = []
                            for fr in c.decode(vs):
                                tt = float(fr.pts * tb) if fr.pts is not None else last
                                last = tt
                                if tt + 1e-9 < nxt:
                                    continue
                                nxt = tt + 1.0 / 3.0
                                f = _feat(fr.to_ndarray(format="rgb24"))
                                if prev is not None:
                                    ds.append(float(np.mean(
                                        [0.5 * np.abs(f[k] - prev[k]).sum()
                                         for k in range(3)])))
                                    ts.append(tt)
                                prev = f
                            dur = float(vs.duration * tb) if vs.duration else last
                        finally:
                            c.close()
                        cuts = [0.0]; lc = -1e9
                        for i in range(len(ds)):
                            lm = ((i == 0 or ds[i] >= ds[i - 1])
                                  and (i + 1 >= len(ds) or ds[i] >= ds[i + 1]))
                            if ds[i] > 0.25 and lm and ts[i] - lc >= 1.5:
                                cuts.append(ts[i]); lc = ts[i]
                        b = sorted(set(cuts + [dur]))
                        wins = [{"start_sec": round(x, 2), "end_sec": round(y, 2)}
                                for x, y in zip(b, b[1:]) if y - x > 0.1]
                        if wins:
                            segments = windows_to_segments(
                                wins, 0.4, "scene cut (pyav); candidate reused footage")
                            method = "shot_detection_pyav"
                    except Exception as exc2:
                        diagnostics.append("pyav shot detection unavailable: %r" % (exc2,))

            if not segments and duration:
                t, wins = 0.0, []
                while t < float(duration):
                    wins.append({"start_sec": round(t, 2),
                                 "end_sec": round(min(t + 8.0, float(duration)), 2)})
                    t += 8.0
                segments = windows_to_segments(
                    wins, 0.3, "uniform window; candidate reused footage")
                method = "uniform_windows"

            if not segments:
                segments = [
                    {"segment_id": "seg_001", "start_sec": 12.0, "end_sec": 24.5,
                     "source_likelihood": 0.81, "reason": "candidate reused footage",
                     "phashes": ["c3e1c3e1c3e1c3e1"], "ocr_text": "LIVE FROM DEMO",
                     "visible_handles": ["@demo_channel"],
                     "context_terms": ["demo", "street", "crowd"]},
                    {"segment_id": "seg_002", "start_sec": 58.2, "end_sec": 67.0,
                     "source_likelihood": 0.64, "reason": "candidate reused footage",
                     "phashes": ["5a5a5a5a5a5a5a5a"], "ocr_text": "",
                     "visible_handles": [], "context_terms": []}]

            return {"job_id": job_id, "status": "analyzed", "mode": mode,
                    "method": method, "segments": segments,
                    "diagnostics": diagnostics,
                    "next_step": "extract_segment_clues"}

    - namespace: clip2trace
      name: detect_source_segments
      description: Detect candidate reused-footage windows in the input video.
      timeout: 300
      inputSchema:
        type: object
        properties:
          job_id: { type: string }
          input_video_file_id: { type: string }
          video_path: { type: string }
          duration_sec: { type: number }
        required: [job_id]
      code: |
        def _stage_input_video(file_id, context, cache_key=None):
            # Download an uploaded clip2trace/input-videos file to /tmp for decode.
            # Base URL = sinas SDK default (not in env/context); bounded ~90 MB.
            import os, base64, tempfile
            def _safe_cache_part(value):
                text = str(value or "")
                cleaned = "".join(
                    ch if ch.isalnum() or ch in "._-" else "_" for ch in text)
                return cleaned.strip("._") or "scope"
            context = context or {}
            token = context.get("access_token")
            if not file_id or not token:
                return None
            base = (context.get("api_url") or context.get("base_url")
                    or os.environ.get("SINAS_BASE_URL")
                    or "http://host.docker.internal:8000").rstrip("/")
            # The files API is name-addressed and returns a JSON envelope
            # {content_base64, content_type, ...} — decode it to a local file.
            from urllib.parse import quote
            url = "%s/files/clip2trace/input-videos/%s" % (
                base, quote(str(file_id), safe=""))
            name = os.path.basename(str(file_id))
            cap = 90 * 1024 * 1024
            path = os.path.join(
                tempfile.gettempdir(),
                "clip2trace",
                "input-videos",
                "user_" + _safe_cache_part(context.get("user_id")),
                "job_" + _safe_cache_part(cache_key),
                name if "." in name else name + ".mp4")
            try:
                if os.path.exists(path) and not os.path.isfile(path):
                    return None
                if os.path.isfile(path):
                    size = os.path.getsize(path)
                    if 0 < size <= cap:
                        return path  # reuse already-staged copy within this job
            except OSError:
                pass
            try:
                import requests
                resp = requests.get(
                    url, timeout=120,
                    headers={"Authorization": "Bearer %s" % token})
                if resp.status_code != 200:
                    return None
                b64 = (resp.json() or {}).get("content_base64")
                if not b64 or (len(b64) * 3) // 4 > cap:
                    return None
                raw = base64.b64decode(b64)
                if len(raw) > cap:
                    return None
                os.makedirs(os.path.dirname(path), exist_ok=True)
                with open(path, "wb") as fh:
                    fh.write(raw)
                return path
            except Exception:
                return None

        def handler(input_data, context):
            if not input_data.get("job_id"):
                return {"error": "job_id is required"}
            video_path = input_data.get("video_path")
            duration = input_data.get("duration_sec")
            diagnostics = []

            file_id = input_data.get("input_video_file_id")
            if not video_path and file_id:
                video_path = _stage_input_video(file_id, context, input_data.get("job_id"))
                diagnostics.append(
                    ("staged input video %s" % file_id) if video_path
                    else ("input video %s could not be staged" % file_id))

            def windows_to_segments(wins, likelihood, reason):
                return [{"segment_id": "seg_%03d" % i,
                         "start_sec": round(float(w["start_sec"]), 2),
                         "end_sec": round(float(w["end_sec"]), 2),
                         "source_likelihood": likelihood, "reason": reason}
                        for i, w in enumerate(wins, 1)]

            if video_path:
                try:
                    from scenedetect import detect, ContentDetector
                    scenes = detect(video_path, ContentDetector())
                    def _secs(tc):
                        return tc.seconds if hasattr(tc, "seconds") else tc.get_seconds()
                    wins = [{"start_sec": _secs(s), "end_sec": _secs(e)}
                            for s, e in scenes]
                    return {"segments": windows_to_segments(
                                wins, 0.5, "shot boundary; candidate reused footage"),
                            "method": "shot_detection", "implemented": True}
                except Exception as exc:
                    diagnostics.append("shot detection unavailable: %r" % (exc,))
                try:
                    import av, numpy as np
                    # Color-histogram shot detection (see analyze_input_video): a
                    # static overlay cancels in the histogram diff and color separates
                    # same-luma scenes, fixing under-segmentation of compilations.
                    def _feat(im):
                        sc = max(1, int(max(im.shape[:2]) / 128))
                        s = im[::sc, ::sc]; out = []
                        for ch in range(3):
                            h, _e = np.histogram(s[:, :, ch], bins=16, range=(0, 255))
                            h = h.astype("float32"); tot = h.sum()
                            out.append(h / tot if tot else h)
                        return out
                    c = av.open(video_path)
                    try:
                        vs = c.streams.video[0]; tb = vs.time_base
                        prev = None; last = 0.0; nxt = 0.0; ts = []; ds = []
                        for fr in c.decode(vs):
                            tt = float(fr.pts * tb) if fr.pts is not None else last
                            last = tt
                            if tt + 1e-9 < nxt:
                                continue
                            nxt = tt + 1.0 / 3.0
                            f = _feat(fr.to_ndarray(format="rgb24"))
                            if prev is not None:
                                ds.append(float(np.mean(
                                    [0.5 * np.abs(f[k] - prev[k]).sum()
                                     for k in range(3)])))
                                ts.append(tt)
                            prev = f
                        dur = float(vs.duration * tb) if vs.duration else last
                    finally:
                        c.close()
                    cuts = [0.0]; lc = -1e9
                    for i in range(len(ds)):
                        lm = ((i == 0 or ds[i] >= ds[i - 1])
                              and (i + 1 >= len(ds) or ds[i] >= ds[i + 1]))
                        if ds[i] > 0.25 and lm and ts[i] - lc >= 1.5:
                            cuts.append(ts[i]); lc = ts[i]
                    b = sorted(set(cuts + [dur]))
                    wins = [{"start_sec": round(x, 2), "end_sec": round(y, 2)}
                            for x, y in zip(b, b[1:]) if y - x > 0.1]
                    if wins:
                        return {"segments": windows_to_segments(
                                    wins, 0.4, "scene cut (pyav); candidate reused footage"),
                                "method": "shot_detection_pyav",
                                "implemented": True, "diagnostics": diagnostics}
                except Exception as exc2:
                    diagnostics.append("pyav shot detection unavailable: %r" % (exc2,))

            if duration:
                t, wins = 0.0, []
                while t < float(duration):
                    wins.append({"start_sec": round(t, 2),
                                 "end_sec": round(min(t + 8.0, float(duration)), 2)})
                    t += 8.0
                return {"segments": windows_to_segments(
                            wins, 0.3, "uniform window; candidate reused footage"),
                        "method": "uniform_windows", "implemented": True,
                        "diagnostics": diagnostics}

            return {"segments": [
                {"segment_id": "seg_001", "start_sec": 12.0, "end_sec": 24.5,
                 "source_likelihood": 0.81, "reason": "candidate reused footage",
                 "phashes": ["c3e1c3e1c3e1c3e1"], "ocr_text": "LIVE FROM DEMO",
                 "visible_handles": ["@demo_channel"],
                 "context_terms": ["demo", "street", "crowd"]},
                {"segment_id": "seg_002", "start_sec": 58.2, "end_sec": 67.0,
                 "source_likelihood": 0.64, "reason": "candidate reused footage",
                 "phashes": ["5a5a5a5a5a5a5a5a"], "ocr_text": "",
                 "visible_handles": [], "context_terms": []}],
                "method": "demo_fixture", "implemented": True,
                "diagnostics": diagnostics}

    - namespace: clip2trace
      name: extract_segment_clues
      description: Extract keyframes, perceptual hashes, OCR text and visible handles.
      timeout: 300
      inputSchema:
        type: object
        properties:
          job_id: { type: string }
          segment_id: { type: string }
          text_hint: { type: string }
          caption: { type: string }
          ocr_text: { type: string }
          input_video_file_id: { type: string }
          video_path: { type: string }
          start_sec: { type: number }
          end_sec: { type: number }
          phashes: { type: array, items: { type: string } }
          keyframe_file_ids: { type: array, items: { type: string } }
          segments: { type: array, items: { type: object } }
        required: [job_id]
        anyOf:
          - { required: [segment_id] }   # single mode
          - { required: [segments] }     # batch mode
      code: |
        def _stage_input_video(file_id, context, cache_key=None):
            # Download an uploaded clip2trace/input-videos file to /tmp for keyframe
            # extraction. Base URL = sinas SDK default (not in env/context); ~90 MB cap.
            import os, base64, tempfile
            def _safe_cache_part(value):
                text = str(value or "")
                cleaned = "".join(
                    ch if ch.isalnum() or ch in "._-" else "_" for ch in text)
                return cleaned.strip("._") or "scope"
            context = context or {}
            token = context.get("access_token")
            if not file_id or not token:
                return None
            base = (context.get("api_url") or context.get("base_url")
                    or os.environ.get("SINAS_BASE_URL")
                    or "http://host.docker.internal:8000").rstrip("/")
            # The files API is name-addressed and returns a JSON envelope
            # {content_base64, content_type, ...} — decode it to a local file.
            from urllib.parse import quote
            url = "%s/files/clip2trace/input-videos/%s" % (
                base, quote(str(file_id), safe=""))
            name = os.path.basename(str(file_id))
            cap = 90 * 1024 * 1024
            path = os.path.join(
                tempfile.gettempdir(),
                "clip2trace",
                "input-videos",
                "user_" + _safe_cache_part(context.get("user_id")),
                "job_" + _safe_cache_part(cache_key),
                name if "." in name else name + ".mp4")
            try:
                if os.path.exists(path) and not os.path.isfile(path):
                    return None
                if os.path.isfile(path):
                    size = os.path.getsize(path)
                    if 0 < size <= cap:
                        return path  # reuse already-staged copy within this job
            except OSError:
                pass
            try:
                import requests
                resp = requests.get(
                    url, timeout=120,
                    headers={"Authorization": "Bearer %s" % token})
                if resp.status_code != 200:
                    return None
                b64 = (resp.json() or {}).get("content_base64")
                if not b64 or (len(b64) * 3) // 4 > cap:
                    return None
                raw = base64.b64decode(b64)
                if len(raw) > cap:
                    return None
                os.makedirs(os.path.dirname(path), exist_ok=True)
                with open(path, "wb") as fh:
                    fh.write(raw)
                return path
            except Exception:
                return None

        def _clues_for_segment(seg, context, video_path, seed_diagnostics=None):
            # Compute the SegmentClues dict for one segment against an already
            # staged video_path (shared across a batch); never stages here. A batch
            # entry that is not a dict or lacks segment_id is a caller error: return
            # a marker with implemented=False, not a clues dict with segment_id None.
            if not isinstance(seg, dict) or not seg.get("segment_id"):
                return {"segment_id": (seg.get("segment_id")
                                       if isinstance(seg, dict) else None),
                        "keyframe_file_ids": [], "phashes": [], "ocr_text": "",
                        "visible_handles": [], "context_terms": [],
                        "ocr_available": False,
                        "diagnostics": list(seed_diagnostics or [])
                        + ["segment requires a segment_id"],
                        "implemented": False}
            import re
            HANDLE_RE = re.compile(r"@([A-Za-z][A-Za-z0-9_]{3,31})")
            HASHTAG_RE = re.compile(r"#(\w{2,64})")
            WORD_RE = re.compile(r"[A-Za-z][A-Za-z0-9]{2,}")
            STOPWORDS = {"the", "and", "for", "with", "this", "that", "from",
                         "video", "live", "breaking", "news", "watch", "today",
                         "footage"}
            seg = seg or {}
            text_hint = seg.get("text_hint", "") or ""
            caption = seg.get("caption", "") or ""
            ocr_text = seg.get("ocr_text", "") or ""
            phashes = list(seg.get("phashes") or [])
            keyframe_file_ids = list(seg.get("keyframe_file_ids") or [])
            start, end = seg.get("start_sec"), seg.get("end_sec")
            diagnostics = list(seed_diagnostics or [])

            # #10 visual: keyframes -> perceptual hashes (full + center-crop).
            # Decode with OpenCV if present, else PyAV (bundles ffmpeg; no system
            # libGL). Hash with Pillow+imagehash only (no OpenCV needed).
            keyframes_rgb = []
            if video_path and start is not None and end is not None:
                s, e, n = float(start), float(end), 3
                step = (e - s) / (n + 1)
                targets = [s + step * i for i in range(1, n + 1)]
                try:
                    import cv2
                    cap = cv2.VideoCapture(video_path)
                    try:
                        for t in targets:
                            cap.set(cv2.CAP_PROP_POS_MSEC, t * 1000.0)
                            ok, frame = cap.read()
                            if ok:
                                keyframes_rgb.append(
                                    cv2.cvtColor(frame, cv2.COLOR_BGR2RGB))
                    finally:
                        cap.release()
                except Exception:
                    try:
                        import av
                        container = av.open(video_path)
                        try:
                            vstream = container.streams.video[0]
                            tb = vstream.time_base
                            for t in targets:
                                try:
                                    container.seek(int(t / tb), stream=vstream,
                                                   backward=True)
                                except Exception:
                                    pass
                                picked = None
                                for fr in container.decode(vstream):
                                    picked = fr
                                    ft = (float(fr.pts * tb)
                                          if fr.pts is not None else t)
                                    if ft >= t:
                                        break
                                if picked is not None:
                                    keyframes_rgb.append(
                                        picked.to_ndarray(format="rgb24"))
                        finally:
                            container.close()
                    except Exception as exc:
                        diagnostics.append(
                            "keyframe extraction unavailable: %r" % (exc,))
                try:
                    import imagehash
                    from PIL import Image
                    for rgb in keyframes_rgb:
                        phashes.append(str(imagehash.phash(Image.fromarray(rgb))))
                        h, w = rgb.shape[:2]
                        ch, cw = int(h * 0.6), int(w * 0.6)
                        y0, x0 = (h - ch) // 2, (w - cw) // 2
                        crop = rgb[y0:y0 + ch, x0:x0 + cw]
                        phashes.append(str(imagehash.phash(Image.fromarray(crop))))
                except Exception as exc:
                    diagnostics.append("hashing unavailable: %r" % (exc,))

            # #11 OCR: tesseract if present, else Claude vision via the OpenAI
            # adapter (no system binary). Supplied ocr_text always wins.
            ocr_available = False
            if not ocr_text and keyframes_rgb:
                try:
                    import importlib
                    pytess = importlib.import_module("pytesseract")
                    from PIL import Image
                    ocr_text = (pytess.image_to_string(
                        Image.fromarray(keyframes_rgb[0])) or "").strip()
                    ocr_available = bool(ocr_text)
                except Exception:
                    pass
            if not ocr_text and keyframes_rgb:
                try:
                    import base64, io, os, json, urllib.request
                    from PIL import Image
                    ctx = context or {}
                    base = (ctx.get("api_url") or ctx.get("base_url")
                            or os.environ.get("SINAS_BASE_URL")
                            or "http://host.docker.internal:8000")
                    token = ctx.get("access_token")
                    if base and token:
                        buf = io.BytesIO()
                        Image.fromarray(keyframes_rgb[0]).save(buf, format="PNG")
                        b64 = base64.b64encode(buf.getvalue()).decode("ascii")
                        body = json.dumps({"model": "claude-sonnet-4-6",
                            "max_tokens": 512, "messages": [{"role": "user",
                            "content": [{"type": "text", "text":
                                "Output ONLY the visible on-screen text in this "
                                "video frame, verbatim. No preamble or markdown. "
                                "If none, output nothing."},
                                {"type": "image", "source": {"type": "base64",
                                 "media_type": "image/png", "data": b64}}]}]}).encode()
                        req = urllib.request.Request(
                            base.rstrip("/") + "/adapters/openai/v1/chat/completions",
                            data=body, method="POST",
                            headers={"Authorization": "Bearer " + token,
                                     "Content-Type": "application/json"})
                        resp = urllib.request.urlopen(req, timeout=60)
                        data = json.loads(resp.read())
                        ocr_text = (data["choices"][0]["message"]["content"]
                                    or "").strip()
                        ocr_available = bool(ocr_text)
                except Exception as exc:
                    diagnostics.append("llm ocr unavailable: %r" % (exc,))
            if not ocr_available:
                ocr_available = bool(ocr_text)

            # #11 text: handles + context terms (OCR text now folded in).
            blob = " ".join([text_hint, caption, ocr_text])
            handles, seen = [], set()
            for m in HANDLE_RE.findall(blob):
                if m.lower() not in seen:
                    seen.add(m.lower())
                    handles.append(m)
            cleaned = HASHTAG_RE.sub(" ", HANDLE_RE.sub(" ", blob))
            context_terms, seen = [], set()
            for w in WORD_RE.findall(cleaned):
                k = w.lower()
                if k in STOPWORDS or k in seen:
                    continue
                seen.add(k)
                context_terms.append(w)
                if len(context_terms) >= 8:
                    break

            return {"segment_id": seg.get("segment_id"),
                    "keyframe_file_ids": keyframe_file_ids, "phashes": phashes,
                    "ocr_text": ocr_text, "visible_handles": handles,
                    "context_terms": context_terms, "ocr_available": ocr_available,
                    "diagnostics": diagnostics, "implemented": True}

        def handler(input_data, context):
            # Single mode: {job_id, segment_id, ...} -> one SegmentClues dict.
            # Batch mode:  {job_id, segments:[{segment_id, ...}, ...]} -> stage the
            # input video ONCE, reuse it across every segment, return
            # {segments:[clues, ...], diagnostics, implemented}.
            input_data = input_data or {}
            if not input_data.get("job_id"):
                return {"error": "job_id is required"}
            segments = input_data.get("segments")
            batch = isinstance(segments, list)
            if not batch and not input_data.get("segment_id"):
                return {"error": "job_id and segment_id are required"}

            # Only stage if some segment actually needs the shared copy (has a
            # keyframe window and no per-segment video_path), so a clues-only batch
            # never triggers a whole-video download.
            def _needs_shared_video(seg):
                seg = seg if isinstance(seg, dict) else {}
                return (seg.get("start_sec") is not None
                        and seg.get("end_sec") is not None
                        and not seg.get("video_path"))

            staging_diags = []
            video_path = input_data.get("video_path")
            file_id = input_data.get("input_video_file_id")
            work = segments if batch else [input_data]
            if (not video_path and file_id
                    and any(_needs_shared_video(s) for s in work)):
                video_path = _stage_input_video(
                    file_id, context, input_data.get("job_id"))
                staging_diags.append(
                    ("staged input video %s" % file_id) if video_path
                    else ("input video %s could not be staged" % file_id))

            if batch:
                out_segments = [
                    _clues_for_segment(
                        seg, context,
                        (seg.get("video_path") if isinstance(seg, dict) else None)
                        or video_path)
                    for seg in segments]
                return {"segments": out_segments, "diagnostics": staging_diags,
                        "implemented": True}

            return _clues_for_segment(input_data, context, video_path, staging_diags)

    - namespace: clip2trace
      name: cluster_segments
      description: Cluster repeated footage across segments; link a candidate to timestamps.
      timeout: 30
      inputSchema:
        type: object
        properties:
          segments: { type: array, items: { type: object } }
          candidate_phashes: { type: array, items: { type: string } }
          threshold: { type: number }
        required: [segments]
      code: |
        def handler(input_data, context):
            # #25: greedy single-link clustering on cross-segment perceptual-hash
            # similarity (port of clip2trace.matching.cluster_segments +
            # link_candidate_to_segments; kept self-contained for the sandbox).
            segments = input_data.get("segments") or []
            threshold = input_data.get("threshold")
            threshold = 0.85 if threshold is None else float(threshold)
            bits = 64

            def _sim(ha, hb):
                if len(ha) != len(hb):
                    return 0.0
                d = bin(int(ha, 16) ^ int(hb, 16)).count("1")
                return max(0.0, 1.0 - d / float(bits))

            def _best(a, b):
                best = 0.0
                for ha in a:
                    for hb in b:
                        try:
                            s = _sim(ha, hb)
                        except Exception:
                            continue
                        if s > best:
                            best = s
                return best

            clusters = []
            for seg in segments:
                sid = seg.get("segment_id")
                ph = list(seg.get("phashes") or [])
                placed = False
                for cl in clusters:
                    if ph and _best(ph, cl["phashes"]) >= threshold:
                        cl["segment_ids"].append(sid)
                        cl["phashes"].extend(ph)
                        placed = True
                        break
                if not placed:
                    clusters.append({"cluster_id": "cluster_%03d" % (len(clusters) + 1),
                                     "segment_ids": [sid], "phashes": list(ph)})

            out = [{"cluster_id": c["cluster_id"], "segment_ids": c["segment_ids"]}
                   for c in clusters]
            result = {"clusters": out, "cluster_count": len(out),
                      "implemented": True}
            cand = list(input_data.get("candidate_phashes") or [])
            if cand:
                result["linked_segment_ids"] = [
                    seg.get("segment_id") for seg in segments
                    if _best(cand, list(seg.get("phashes") or [])) >= threshold]
            return result

    - namespace: clip2trace
      name: generate_telegram_queries
      description: Turn segment clues into a small ranked Telegram query set.
      timeout: 30
      inputSchema:
        type: object
        properties:
          visible_handles: { type: array, items: { type: string } }
          ocr_text: { type: string }
          context_terms: { type: array, items: { type: string } }
          caption: { type: string }
      code: |
        def handler(input_data, context):
            qs, seen = [], set()
            def add(q, t, p, r):
                k = (q or "").strip().lower()
                if q and k not in seen:
                    seen.add(k)
                    qs.append({"query": q, "query_type": t, "priority": p, "reason": r})
            for h in (input_data.get("visible_handles") or []):
                add("@" + str(h).lstrip("@"), "handle", 1, "Exact handle is strongest signal.")
            ocr = (input_data.get("ocr_text") or "").strip()
            if 0 < len(ocr) <= 120:
                add(ocr, "ocr_exact", 2, "Exact on-screen text.")
            for term in (input_data.get("context_terms") or []):
                add(term, "context", 3, "Contextual term.")
            qs.sort(key=lambda x: x["priority"])
            return {"queries": qs}

    - namespace: clip2trace
      name: search_global_telegram_posts
      description: Global Telegram post search (live via Telethon) or demo/cached fallback.
      sharedPool: true
      timeout: 120
      inputSchema:
        type: object
        properties:
          queries: { type: array, items: { type: object } }
          mode: { type: string, default: demo }
          cached_results: { type: array, items: { type: object } }
          manual_urls: { type: array, items: { type: string } }
      code: |
        # Self-contained: the sandbox can't import clip2trace. Mirrors
        # src/clip2trace/telegram_live.py. channels.searchPosts is user-only;
        # hashtag is unmetered, free-text is metered (we never spend Stars).
        def handler(input_data, context):
            input_data = input_data or {}
            context = context or {}
            mode = input_data.get("mode", "demo")
            queries = input_data.get("queries") or []
            manual = input_data.get("manual_urls") or []
            if manual:
                return {"status": "ok", "source": "manual_urls",
                        "candidates": [{"candidate_id": "manual_%d" % i, "url": u}
                                       for i, u in enumerate(manual)]}
            cached = input_data.get("cached_results")
            if cached is not None:
                return {"status": "ok", "source": "cached", "candidates": cached}
            if mode in ("live", "hybrid"):
                secrets = context.get("secrets") or {}
                api_id = secrets.get("TELEGRAM_API_ID")
                api_hash = secrets.get("TELEGRAM_API_HASH")
                session = secrets.get("TELEGRAM_SESSION_STRING")
                if not (api_id and api_hash and session):
                    return {"status": "live_unavailable", "source": "none",
                            "candidates": [], "diagnostics":
                            ["missing Telegram secrets/session or not sharedPool"]}
                try:
                    from telethon.sync import TelegramClient
                    from telethon.sessions import StringSession
                    from telethon import functions, types
                    from telethon.errors import FloodWaitError
                except Exception as exc:
                    return {"status": "live_unavailable", "source": "none",
                            "candidates": [], "diagnostics":
                            ["telethon unavailable: %r" % (exc,)]}
                results, seen, diags = [], set(), []
                try:
                    with TelegramClient(StringSession(session), int(api_id), api_hash) as client:
                        for q in queries:
                            text = (q.get("query") or "").strip()
                            if not text:
                                continue
                            if q.get("query_type") == "hashtag" or text.startswith("#"):
                                hashtag, query = text.lstrip("#"), None
                            else:
                                hashtag, query = None, text
                            offset_rate, offset_id, pages = 0, 0, 0
                            try:
                                while pages < 5 and len(results) < 50:
                                    res = client(functions.channels.SearchPostsRequest(
                                        hashtag=hashtag, query=query, offset_rate=offset_rate,
                                        offset_peer=types.InputPeerEmpty(),
                                        offset_id=offset_id, limit=100))
                                    msgs = list(getattr(res, "messages", []) or [])
                                    if not msgs:
                                        break
                                    chats = {getattr(c, "id", None): c
                                             for c in (getattr(res, "chats", []) or [])}
                                    for m in msgs:
                                        peer = getattr(m, "peer_id", None)
                                        ch = chats.get(getattr(peer, "channel_id", None))
                                        user = getattr(ch, "username", None) if ch else None
                                        mid = getattr(m, "id", None)
                                        key = "%s_%s" % (user or "unknown", mid)
                                        if key in seen:
                                            continue
                                        seen.add(key)
                                        date = getattr(m, "date", None)
                                        results.append({
                                            "candidate_id": key, "channel": user,
                                            "message_id": mid,
                                            "url": ("https://t.me/%s/%s" % (user, mid))
                                                   if user and mid else None,
                                            "posted_at": date.isoformat()
                                                         if hasattr(date, "isoformat") else None,
                                            "caption": getattr(m, "message", "") or "",
                                            "has_media": getattr(m, "media", None) is not None,
                                            "is_forward": getattr(m, "fwd_from", None) is not None,
                                            "accessible": True, "source_query": q.get("query")})
                                    nr = getattr(res, "next_rate", None)
                                    if not nr:
                                        break
                                    offset_rate = nr
                                    offset_id = getattr(msgs[-1], "id", 0) or 0
                                    pages += 1
                            except FloodWaitError as exc:
                                diags.append("flood wait %ss; stopping" %
                                             getattr(exc, "seconds", "?"))
                                break
                            except Exception as exc:
                                diags.append("query failed %r: %r" % (q.get("query"), exc))
                    return {"status": "ok", "source": "live",
                            "candidates": results, "diagnostics": diags}
                except Exception as exc:
                    return {"status": "live_unavailable", "source": "none",
                            "candidates": [], "diagnostics":
                            ["live search error: %r" % (exc,)]}
            return {"status": "demo_no_data", "source": "none", "candidates": [],
                    "diagnostics": ["demo mode and no cached_results/manual_urls supplied"]}

    - namespace: clip2trace
      name: fetch_telegram_candidate_media
      description: Fetch candidate metadata and optionally bounded media (dry-run by default).
      sharedPool: true
      timeout: 120
      inputSchema:
        type: object
        properties:
          candidates: { type: array, items: { type: object } }
          dry_run: { type: boolean, default: true }
      code: |
        # Self-contained mirror of clip2trace.telegram_media + telegram_live
        # download_candidates. Dry-run by default (metadata only); bounded live
        # download needs sharedPool secrets + telethon. Downloads work with the
        # user session; bounded by per-file cap, count, and /tmp byte budget.
        def handler(input_data, context):
            input_data = input_data or {}
            context = context or {}
            cands = input_data.get("candidates") or []
            dry_run = input_data.get("dry_run", True)

            def _norm(c):
                ch, mid = c.get("channel"), c.get("message_id")
                url = c.get("url")
                if not url and ch and mid:
                    url = "https://t.me/%s/%s" % (str(ch).lstrip("@"), mid)
                return {"candidate_id": c.get("candidate_id", "cand_unknown"),
                        "channel": ch, "message_id": mid, "url": url,
                        "caption": c.get("caption", ""),
                        "has_media": bool(c.get("has_media")),
                        "media_file_id": c.get("media_file_id"),
                        "phashes": list(c.get("phashes") or []),
                        "accessible": c.get("accessible", True)}

            out = [_norm(c) for c in cands]
            if dry_run:
                return {"status": "metadata_only", "candidates": out, "downloaded": 0}

            secrets = context.get("secrets") or {}
            api_id = secrets.get("TELEGRAM_API_ID")
            api_hash = secrets.get("TELEGRAM_API_HASH")
            session = secrets.get("TELEGRAM_SESSION_STRING")
            if not (api_id and api_hash and session):
                return {"status": "metadata_only", "candidates": out,
                        "downloaded": 0,
                        "diagnostics": ["no Telegram secrets/session; metadata only"]}
            try:
                import os
                from telethon.sync import TelegramClient
                from telethon.sessions import StringSession
                from telethon.errors import FloodWaitError
            except Exception as exc:
                return {"status": "metadata_only", "candidates": out,
                        "downloaded": 0,
                        "diagnostics": ["telethon unavailable: %r" % (exc,)]}

            max_media, max_bytes, total_budget = 5, 8000000, 80000000
            inaccessible = ("ChannelPrivateError", "ChannelInvalidError",
                            "MsgIdInvalidError", "MediaEmptyError",
                            "FileIdInvalidError", "LocationInvalidError",
                            "UsernameInvalidError", "UsernameNotOccupiedError")
            downloaded, spent, diags = 0, 0, []

            def _phashes_for_media(p):
                # Decode a downloaded candidate clip/image into perceptual hashes
                # (PyAV keyframes, else still image), so verify_media_similarity
                # has candidate phashes — else visual_similarity is always 0.
                hashes = []
                try:
                    import imagehash
                    from PIL import Image
                except Exception:
                    return hashes
                frames = []
                try:
                    import av
                    c = av.open(p)
                    try:
                        dur = (float(c.duration) / 1000000.0) if c.duration else 6.0
                        s = c.streams.video[0]
                        tb = s.time_base
                        n = 3
                        step = dur / (n + 1)
                        for i in range(1, n + 1):
                            t = step * i
                            try:
                                c.seek(int(t / tb), stream=s, backward=True)
                            except Exception:
                                pass
                            picked = None
                            for fr in c.decode(s):
                                picked = fr
                                ft = float(fr.pts * tb) if fr.pts is not None else t
                                if ft >= t:
                                    break
                            if picked is not None:
                                frames.append(picked.to_ndarray(format="rgb24"))
                    finally:
                        c.close()
                except Exception:
                    pass
                if not frames:
                    try:
                        import numpy as np
                        with Image.open(p) as im:
                            frames = [np.asarray(im.convert("RGB"))]
                    except Exception:
                        frames = []
                for rgb in frames:
                    try:
                        hashes.append(str(imagehash.phash(Image.fromarray(rgb))))
                        h, w = rgb.shape[:2]
                        chh, cww = int(h * 0.6), int(w * 0.6)
                        y0, x0 = (h - chh) // 2, (w - cww) // 2
                        crop = rgb[y0:y0 + chh, x0:x0 + cww]
                        hashes.append(str(imagehash.phash(Image.fromarray(crop))))
                    except Exception:
                        pass
                return hashes

            try:
                with TelegramClient(StringSession(session), int(api_id), api_hash) as client:
                    for cand in out:
                        if downloaded >= max_media:
                            break
                        if not cand.get("has_media") or not cand.get("accessible"):
                            continue
                        ch, mid = cand.get("channel"), cand.get("message_id")
                        if not ch or not mid:
                            continue
                        try:
                            msg = client.get_messages(ch, ids=mid)
                            if msg is None:
                                cand["accessible"] = False
                                diags.append("%s/%s: not found or deleted" % (ch, mid))
                                continue
                            size = getattr(getattr(msg, "file", None), "size", None)
                            if size is not None and size > max_bytes:
                                diags.append("%s/%s: over per-file cap" % (ch, mid))
                                continue
                            if size and spent + size > total_budget:
                                diags.append("tmp byte budget reached; stopping")
                                break
                            path = client.download_media(msg, file="/tmp")
                            if path is None:
                                cand["accessible"] = False
                                diags.append("%s/%s: no downloadable media" % (ch, mid))
                                continue
                            actual = size
                            if actual is None:
                                try:
                                    actual = os.path.getsize(path)
                                except OSError:
                                    actual = 0
                            if actual > max_bytes or spent + actual > total_budget:
                                try:
                                    os.remove(path)
                                except OSError:
                                    pass
                                if actual > max_bytes:
                                    diags.append("%s/%s: over per-file cap" % (ch, mid))
                                    continue
                                diags.append("tmp byte budget reached; stopping")
                                break
                            cand["media_file_id"] = path
                            try:
                                ph = _phashes_for_media(path)
                                if ph:
                                    cand["phashes"] = list(
                                        cand.get("phashes") or []) + ph
                            except Exception as exc:
                                diags.append("%s/%s: phash failed (%r)" % (ch, mid, exc))
                            downloaded += 1
                            spent += actual
                        except FloodWaitError as exc:
                            diags.append("flood wait %ss; stopping" %
                                         getattr(exc, "seconds", "?"))
                            break
                        except Exception as exc:
                            cand["accessible"] = False
                            name = type(exc).__name__
                            diags.append("%s/%s: download failed (%s)" % (ch, mid,
                                         "inaccessible" if name in inaccessible else name))
                return {"status": "ok", "candidates": out,
                        "downloaded": downloaded, "diagnostics": diags}
            except Exception as exc:
                return {"status": "metadata_only", "candidates": out,
                        "downloaded": downloaded,
                        "diagnostics": ["live download error: %r" % (exc,)]}

    - namespace: clip2trace
      name: verify_media_similarity
      description: Compare segment keyframes vs candidate media (perceptual hash + text).
      timeout: 120
      inputSchema:
        type: object
        properties:
          segment_phashes: { type: array, items: { type: string } }
          candidate_phashes: { type: array, items: { type: string } }
          segment_text: { type: string }
          candidate_text: { type: string }
          segment_duration: { type: number }
          candidate_duration: { type: number }
      code: |
        def handler(input_data, context):
            def ham(a, b):
                return bin(int(a, 16) ^ int(b, 16)).count("1")
            sa = input_data.get("segment_phashes") or []
            sb = input_data.get("candidate_phashes") or []
            best, frames = 0.0, []
            for i, a in enumerate(sa):
                for j, b in enumerate(sb):
                    if len(a) != len(b):
                        continue
                    sim = max(0.0, 1.0 - ham(a, b) / 64.0)
                    if sim >= 0.85:
                        frames.append({"segment_frame": i, "candidate_frame": j,
                                       "similarity": round(sim, 4)})
                    best = max(best, sim)
            ta = set(str(input_data.get("segment_text", "")).lower().split())
            tb = set(str(input_data.get("candidate_text", "")).lower().split())
            text = len(ta & tb) / len(ta | tb) if ta and tb else 0.0
            sd = input_data.get("segment_duration") or 0.0
            cd = input_data.get("candidate_duration") or 0.0
            if sd and cd:
                r = min(float(sd), float(cd)) / max(float(sd), float(cd))
                temporal = max(0.0, (r - 0.75) / 0.25)
            else:
                temporal = 0.0
            overall = round(0.6 * best + 0.25 * text + 0.15 * temporal, 4)
            return {"visual_score": round(best, 4), "text_score": round(text, 4),
                    "temporal_score": round(temporal, 4), "overall_score": overall,
                    "matched_frames": frames}

    - namespace: clip2trace
      name: rank_source_candidates
      description: Apply the evidence scoring rubric and produce ranked candidates with caveats.
      timeout: 60
      inputSchema:
        type: object
        properties:
          candidates: { type: array, items: { type: object } }
      code: |
        def handler(input_data, context):
            W = {"visual_similarity": 0.40, "handle_watermark": 0.15,
                 "ocr_caption_query": 0.15, "predates_input": 0.15,
                 "temporal_alignment": 0.05, "channel_relevance": 0.05,
                 "forward_repost": 0.05}
            def label(s):
                for lo, name in [(0.85, "very_strong"), (0.70, "strong"),
                                 (0.50, "plausible"), (0.30, "weak")]:
                    if s >= lo:
                        return name
                return "reject"
            def evidence_for(c):
                ev = c.get("evidence")
                if ev:
                    return ev
                v = c.get("verification") or {}
                if v:
                    return {"visual_similarity": v.get("visual_score", 0.0),
                            "ocr_caption_query": v.get("text_score", 0.0),
                            "temporal_alignment": v.get("temporal_score", 0.0),
                            "handle_watermark": c.get("handle_match", 0.0),
                            "predates_input": c.get("predates_input", 0.0),
                            "channel_relevance": c.get("channel_relevance", 0.0),
                            "forward_repost": c.get("forward_repost", 0.0)}
                return {}
            steps = ["Open the Telegram link and confirm the media visually.",
                     "Check whether the post is itself a forward/repost.",
                     "Compare post timestamp against the input video's publication date."]
            out = []
            for c in (input_data.get("candidates") or []):
                ev = evidence_for(c)
                score = sum(W[k] * max(0.0, min(1.0, float(ev.get(k, 0.0)))) for k in W)
                out.append({"candidate_id": c.get("candidate_id"),
                            "confidence": round(score, 4),
                            "confidence_label": label(score),
                            "rejected": score < 0.30, "evidence": ev,
                            "caveats": ["Telegram post may itself be a repost.",
                                        "Automated score; verify manually."],
                            "recommended_next_steps": steps,
                            "url": c.get("url"),
                            "thumbnail_url": c.get("thumbnail_url")})
            out.sort(key=lambda x: x["confidence"], reverse=True)
            return {"ranked_candidates": out}

    - namespace: clip2trace
      name: render_report
      description: Build the provenance report JSON (cautious language, caveats included).
      timeout: 60
      inputSchema:
        type: object
        properties:
          job_id: { type: string }
          segments: { type: array, items: { type: object } }
          clusters: { type: array, items: { type: object } }
          ranked_candidates: { type: array, items: { type: object } }
          mode: { type: string, default: demo }
          output_format: { type: string, enum: [json, html, both], default: json }
        required: [job_id]
      code: |
        def handler(input_data, context):
            import html as _html
            job_id = input_data.get("job_id")
            if not job_id:
                return {"error": "job_id is required"}
            ranked = input_data.get("ranked_candidates") or []
            kept = [c for c in ranked if not c.get("rejected")]
            mode = input_data.get("mode", "demo")
            # #25: repeated footage — only clusters covering >1 segment are notable.
            clusters = input_data.get("clusters") or []
            repeated = [c for c in clusters
                        if len(c.get("segment_ids") or []) > 1]
            report = {
                "job_id": job_id,
                "summary": ("Likely Telegram source candidates for human "
                            "verification; not confirmed sources."),
                "generated_mode": mode,
                "segments": input_data.get("segments") or [],
                "repeated_footage": repeated,
                "ranked_candidates": kept,
                "caveats": [
                    "Global Telegram search is retrieval, not proof of origin.",
                    "A matched post may itself be a repost.",
                    "Private/deleted posts are out of scope.",
                    "Confidence scores are automated; verify manually."]}
            result = {"report_json": report, "report_file_id": None,
                      "summary": report["summary"]}
            if input_data.get("output_format", "json") in ("html", "both"):
                def esc(x):
                    return _html.escape(str(x))
                cards = []
                for c in kept:
                    lbl = esc(c.get("confidence_label", "unknown"))
                    thumb = str(c.get("thumbnail_url") or "").strip()
                    img = ("<img src='%s' loading='lazy' alt='candidate media "
                           "thumbnail' style='max-width:160px;float:right'>"
                           % esc(thumb)) if thumb.lower().startswith(
                               ("http://", "https://")) else ""
                    url = c.get("url")
                    safe = str(url or "").strip()
                    if safe.lower().startswith(("http://", "https://")):
                        link = ('<a href="%s" rel="noopener noreferrer">%s</a>'
                                % (esc(safe), esc(safe)))
                    elif url:
                        link = esc(url)
                    else:
                        link = "(no link)"
                    cards.append("<div class='card %s'>%s<h3>%s — %s (%s)</h3>"
                                 "<p>%s</p></div>" % (
                                     lbl, img, esc(c.get("candidate_id")), lbl,
                                     esc(c.get("confidence", 0)), link))
                cav = "".join("<li>%s</li>" % esc(x) for x in report["caveats"])
                rep = ""
                if repeated:
                    items = "".join(
                        "<li><code>%s</code>: reused across %s</li>" % (
                            esc(c.get("cluster_id")),
                            esc(", ".join(c.get("segment_ids") or [])))
                        for c in repeated)
                    rep = ("<h2>Repeated footage</h2><p>Same footage detected at "
                           "multiple timestamps:</p><ul>%s</ul>" % items)
                result["report_html"] = (
                    "<!doctype html><html lang='en'><head><meta charset='utf-8'>"
                    "<title>clip2trace provenance report — %s</title></head><body>"
                    "<h1>clip2trace provenance report</h1>"
                    "<p>job <code>%s</code> · mode <code>%s</code></p>"
                    "<p>%s</p><h2>Likely Telegram source candidates</h2>%s%s"
                    "<h2>Caveats</h2><ul>%s</ul>"
                    "<footer>Likely candidates for human verification — not "
                    "confirmed sources.</footer></body></html>" % (
                        esc(job_id), esc(job_id), esc(mode), esc(report["summary"]),
                        ("\n".join(cards) or "<p>No candidates retained.</p>"),
                        rep, cav))
            return result

  skills:
    - namespace: clip2trace
      name: telegram-source-tracing
      description: How to trace reused footage to likely Telegram source candidates.
      content: |
        See skills/telegram-source-tracing.md. Global Telegram search is
        retrieval, not proof. Visual verification is required. A Telegram post
        may be a repost. Private/deleted posts are out of scope. Never overclaim.
    - namespace: clip2trace
      name: evidence-scoring-rubric
      description: Weights and confidence labels for ranking source candidates.
      content: |
        See skills/evidence-scoring-rubric.md. Weights: visual 0.40, handle 0.15,
        ocr/caption 0.15, predates-input 0.15, temporal 0.05, channel 0.05,
        forward 0.05. Labels: >=0.85 very_strong, >=0.70 strong, >=0.50 plausible,
        >=0.30 weak, <0.30 reject.
    - namespace: clip2trace
      name: report-style
      description: Cautious, evidence-backed provenance report writing style.
      content: |
        See skills/report-style.md. Use "candidate", "likely", "evidence
        suggests". Never "confirmed original" in automated output.

  agents:
    - namespace: clip2trace
      name: coordinator
      description: Orchestrates source tracing for one input video, evidence-first and cautious.
      llmProviderName: "${{ vars.PRIMARY_LLM }}"
      model: claude-sonnet-4-6
      temperature: 0.2
      systemPrompt: |
        See agents/coordinator.md. Orchestrate the pipeline and never claim an
        original source — only likely candidates with caveats.
        INTEGRITY — NO FABRICATION (highest priority, overrides every other
        instruction): every Telegram candidate and every number in the report MUST
        come verbatim from a function return. NEVER invent, guess, autocomplete or
        "fill in" a candidate, channel, message URL, caption, date, view count,
        phash, or any visual/text/temporal/overall score from your own knowledge —
        not even a plausible-looking one. You have ONLY the enabled functions; you
        have NO channel-enumeration or reverse-video capability, so never narrate a
        fallback step (e.g. "OCR-driven channel enumeration") you cannot actually
        run. If search_global_telegram_posts returns 0 candidates, status
        live_unavailable, or an empty list, there is NOTHING to fetch, verify or
        rank: call render_report with an EMPTY ranked_candidates list and state
        plainly "No Telegram source candidates found (live search returned 0 /
        unavailable)" — do NOT manufacture candidates to fill the report, and set
        the job's top_candidate to null. Report a visual/phash score for a
        candidate ONLY if fetch_telegram_candidate_media actually returned that
        candidate's media (a media_file_id and real candidate phashes); never reuse
        the INPUT video's own phashes as a candidate's, and never claim matched
        keyframes for media you did not download. Persist to the stores only the
        literal function outputs. DEMO MODE: when the
        user asks for demo mode (or gives no input video), do NOT ask for a file —
        immediately call create_job(mode="demo") and run the pipeline; the
        functions return the bundled demo fixtures (segments + cached Telegram
        candidates), so produce the full provenance report without any upload. Only
        request an input video for live/hybrid runs that need real footage. For
        live/hybrid runs, capture the uploaded input_video_file_id in create_job and
        PASS it to analyze_input_video so the function downloads the real video to the
        worker and decodes it (otherwise it falls back to demo segments). For
        live/hybrid runs, analyze_input_video returns segments WITHOUT phashes — so
        after it returns, call extract_segment_clues ONCE in batch mode, passing
        input_video_file_id plus a segments array of every segment's
        {segment_id, start_sec, end_sec}, to populate each segment's real phashes,
        ocr_text and visible_handles in a single call (the video is staged once and
        reused across all segments); it returns {segments: [...clues]} to merge back
        by segment_id (demo mode already ships phashes, so this step is skipped
        there). Only once segments have phashes,
        call cluster_segments to group footage reused at
        multiple timestamps, and pass its clusters to render_report; when a candidate
        matches, also call cluster_segments with that candidate's phashes to link it
        to every matching timestamp (one candidate -> many segments). When
        calling verify_media_similarity, you MUST pass segment_phashes (the
        segment's phashes), candidate_phashes (the candidate's phashes),
        segment_text (the segment's ocr_text), candidate_text (the candidate's
        caption), and segment_duration/candidate_duration from the timecodes —
        otherwise the visual score is 0 and every candidate is wrongly rejected.
        PERSIST job state to
        the clip2trace/jobs store (key = job_id): write the status on each step
        (created -> analyzing -> searching -> verifying -> ranking -> reporting ->
        done), and on failure set status=failed with the error message. Persist
        segments to clip2trace/segments, search hits to clip2trace/search-results,
        and media matches to clip2trace/candidate-matches as they are produced.
        (Functions are pure transforms — they return data; you hold the store
        access and are responsible for persistence.)
      enabledFunctions:
        - clip2trace/create_job
        - clip2trace/analyze_input_video
        - clip2trace/extract_segment_clues
        - clip2trace/cluster_segments
        - clip2trace/search_global_telegram_posts
        - clip2trace/fetch_telegram_candidate_media
        - clip2trace/verify_media_similarity
        - clip2trace/rank_source_candidates
        - clip2trace/render_report
      enabledSkills:
        - { skill: clip2trace/telegram-source-tracing, preload: true }
        - { skill: clip2trace/report-style, preload: true }
      enabledStores:
        - { store: clip2trace/jobs, access: readwrite }
        - { store: clip2trace/segments, access: readwrite }
        - { store: clip2trace/search-results, access: readwrite }
        - { store: clip2trace/candidate-matches, access: readwrite }
    - namespace: clip2trace
      name: source-segment-analyst
      description: Classifies segment type and outputs source likelihood + search clues.
      llmProviderName: "${{ vars.PRIMARY_LLM }}"
      model: claude-sonnet-4-6
      temperature: 0.2
      systemPrompt: |
        See agents/source-segment-analyst.md. Detect candidate segments and extract
        clues, then PERSIST each segment with its clues (visible_handles, ocr_text,
        context_terms, phashes) to the clip2trace/segments store, keyed by
        segment_id, so later steps and the dashboard can read them. For live/hybrid
        runs, pass the job's input_video_file_id into detect_source_segments and
        extract_segment_clues so they decode the real uploaded video.
      enabledFunctions:
        - clip2trace/detect_source_segments
        - clip2trace/extract_segment_clues
        - clip2trace/cluster_segments
      enabledStores:
        - { store: clip2trace/segments, access: readwrite }
    - namespace: clip2trace
      name: telegram-query-planner
      description: Converts clues into a small ranked global Telegram query set.
      llmProviderName: "${{ vars.PRIMARY_LLM }}"
      model: claude-sonnet-4-6
      temperature: 0.2
      systemPrompt: |
        See agents/telegram-query-planner.md.
      enabledFunctions:
        - clip2trace/generate_telegram_queries
      enabledSkills:
        - { skill: clip2trace/telegram-source-tracing, preload: true }
      enabledStores:
        - { store: clip2trace/query-cache, access: readwrite }
    - namespace: clip2trace
      name: evidence-ranker
      description: Scores candidates with the rubric and always includes caveats.
      llmProviderName: "${{ vars.PRIMARY_LLM }}"
      model: claude-sonnet-4-6
      temperature: 0.1
      systemPrompt: |
        See agents/evidence-ranker.md.
      enabledFunctions:
        - clip2trace/verify_media_similarity
        - clip2trace/rank_source_candidates
      enabledSkills:
        - { skill: clip2trace/evidence-scoring-rubric, preload: true }
      enabledStores:
        - { store: clip2trace/candidate-matches, access: readwrite }
    - namespace: clip2trace
      name: report-writer
      description: Writes a cautious provenance report for human verification.
      llmProviderName: "${{ vars.PRIMARY_LLM }}"
      model: claude-sonnet-4-6
      temperature: 0.2
      systemPrompt: |
        See agents/report-writer.md. Render the provenance report (cautious
        language; never "original"). SAVE the report JSON to the clip2trace/reports
        collection (metadata: job_id) and set the job's status to "done" in the
        clip2trace/jobs store.
      enabledFunctions:
        - clip2trace/render_report
      enabledSkills:
        - { skill: clip2trace/report-style, preload: true }
      enabledStores:
        - { store: clip2trace/jobs, access: readwrite }
      enabledCollections:
        - { collection: clip2trace/reports, access: readwrite }

  components:
    - namespace: clip2trace
      name: dashboard
      title: clip2trace
      visibility: shared
      enabledFunctions:
        - clip2trace/create_job
        - clip2trace/render_report
      enabledStores:
        - { store: clip2trace/jobs, access: readonly }
      sourceCode: |
        // clip2trace dashboard — Sinas component (#19, #20).
        //
        // Runs / inspects a source-tracing job and renders the provenance report:
        // candidate source segments + likely Telegram source candidates with evidence,
        // confidence, and caveats. Provenance language is non-negotiable — this UI shows
        // "likely Telegram source candidate" / "best candidate found", never
        // "the original" / "confirmed original".
        //
        // Wiring (see docs/dashboard-wireframe.md):
        //   - demo mode runs fully offline against a bundled fixture, so the component
        //     always renders something even without a live instance.
        //   - live/hybrid mode calls the package functions through the injected `sinas`
        //     client (create_job -> render_report) and, for the long analysis step, polls
        //     an async execution (execute/async -> GET /executions/{id}) — #20.
        //   - the exact `sinas` client method surface differs across embed contexts, so
        //     calls go through small adapters (callFunction / enqueueFunction /
        //     getExecution) that feature-detect the available method and otherwise
        //     surface a clear error. Adjust the adapters if the live SDK differs.

        import React, { useCallback, useEffect, useRef, useState } from "react";

        const STATES = ["configure", "select-video", "start", "progress", "report"];

        // Bundled demo fixture so the dashboard renders end-to-end with no live instance.
        // Mirrors the shape render_report returns (docs/api-contracts.md). Cautious
        // language only — these are candidates, not "originals".
        // Shaped like render_report's report_json (docs/api-contracts.md): generated_mode
        // + rubric evidence keys (src/clip2trace/scoring.py). The live path normalizes the
        // {report_json, ...} wrapper down to this same shape before rendering.
        const DEMO_REPORT = {
          job_id: "job_demo",
          generated_mode: "demo",
          segments: [
            {
              segment_id: "seg_001",
              start_sec: 12.0,
              end_sec: 24.5,
              source_likelihood: 0.81,
              reason: "static establishing shot, no edit overlays",
              visible_handles: ["@demo_channel"],
              context_terms: ["square", "crowd", "city"],
            },
          ],
          ranked_candidates: [
            {
              candidate_id: "c1",
              url: "https://t.me/demo_channel/4521",
              channel: "@demo_channel",
              post_time: "2026-05-30T09:12:00Z",
              caption: "crowd gathers in the city square",
              confidence: 0.78,
              confidence_label: "strong candidate",
              rejected: false,
              segment_ids: ["seg_001"],
              evidence: {
                visual_similarity: 0.95,
                handle_watermark: 0.8,
                ocr_caption_query: 0.6,
                predates_input: 1.0,
                temporal_alignment: 0.7,
              },
              caveats: [
                "Global search is retrieval, not proof.",
                "Earliest known appearance, not necessarily the source.",
              ],
              recommended_next_steps: [
                "Inspect the channel's own forwards for an earlier copy.",
              ],
            },
          ],
          summary: "1 likely Telegram source candidate found for 1 reused segment.",
        };

        // --- sinas client adapters (feature-detect; never invent a single method) -----

        async function callFunction(sinas, name, input) {
          const fns = (sinas && sinas.functions) || {};
          if (typeof fns.run === "function") return fns.run(name, input);
          if (typeof fns.execute === "function") return fns.execute(name, input);
          if (sinas && typeof sinas.run === "function") return sinas.run(name, input);
          throw new Error("sinas client exposes no functions.run/execute");
        }

        async function enqueueFunction(sinas, name, input) {
          const fns = (sinas && sinas.functions) || {};
          if (typeof fns.runAsync === "function") return fns.runAsync(name, input);
          if (typeof fns.executeAsync === "function") return fns.executeAsync(name, input);
          // Fall back to a synchronous call wrapped to look async (small jobs / demo).
          const result = await callFunction(sinas, name, input);
          return { execution_id: null, result };
        }

        async function getExecution(sinas, executionId) {
          const ex = (sinas && sinas.executions) || {};
          if (typeof ex.get === "function") return ex.get(executionId);
          throw new Error("sinas client exposes no executions.get");
        }

        // --- presentational pieces ----------------------------------------------------

        function Pill({ children, tone = "neutral" }) {
          const bg = {
            strong: "#1b5e20",
            medium: "#8d6e00",
            weak: "#7a2e2e",
            neutral: "#444",
          }[tone];
          return (
            <span
              style={{
                background: bg,
                color: "#fff",
                borderRadius: 10,
                padding: "1px 8px",
                fontSize: 12,
                marginLeft: 6,
              }}
            >
              {children}
            </span>
          );
        }

        function toneForConfidence(c) {
          if (c >= 0.7) return "strong";
          if (c >= 0.4) return "medium";
          return "weak";
        }

        function fmtRange(s, e) {
          const f = (n) => (n == null ? "?" : Number(n).toFixed(1) + "s");
          return `${f(s)}–${f(e)}`;
        }

        function SegmentCard({ seg }) {
          return (
            <div
              style={{
                border: "1px solid #ccc",
                borderRadius: 8,
                padding: 12,
                marginBottom: 8,
              }}
            >
              <strong>{seg.segment_id}</strong>
              <Pill>{fmtRange(seg.start_sec, seg.end_sec)}</Pill>
              {seg.source_likelihood != null && (
                <Pill tone={toneForConfidence(seg.source_likelihood)}>
                  likelihood {Number(seg.source_likelihood).toFixed(2)}
                </Pill>
              )}
              {seg.reason && <p style={{ margin: "6px 0 0", color: "#555" }}>{seg.reason}</p>}
              {Array.isArray(seg.visible_handles) && seg.visible_handles.length > 0 && (
                <p style={{ margin: "4px 0 0", fontSize: 13 }}>
                  {/* handles may already carry a leading @ (demo fixtures do) */}
                  handles: {seg.visible_handles.map((h) => "@" + String(h).replace(/^@+/, "")).join(", ")}
                </p>
              )}
              {Array.isArray(seg.context_terms) && seg.context_terms.length > 0 && (
                <p style={{ margin: "2px 0 0", fontSize: 13, color: "#777" }}>
                  terms: {seg.context_terms.join(", ")}
                </p>
              )}
            </div>
          );
        }

        function CandidateCard({ cand }) {
          const ev = cand.evidence || {};
          return (
            <div
              style={{
                border: "1px solid #ccc",
                borderRadius: 8,
                padding: 12,
                marginBottom: 8,
                opacity: cand.rejected ? 0.55 : 1,
              }}
            >
              <strong>{cand.channel || cand.candidate_id}</strong>
              {cand.confidence != null && (
                <Pill tone={toneForConfidence(cand.confidence)}>
                  {cand.confidence_label || "candidate"} {Number(cand.confidence).toFixed(2)}
                </Pill>
              )}
              {cand.rejected && <Pill tone="weak">rejected</Pill>}
              {cand.caption && <p style={{ margin: "6px 0 0", color: "#555" }}>{cand.caption}</p>}
              {/* evidence keys mirror the scoring rubric (src/clip2trace/scoring.py); all
                  are 0..1 scores, including predates_input — render the number, not yes/no */}
              <p style={{ margin: "4px 0 0", fontSize: 13, color: "#777" }}>
                visual {ev.visual_similarity ?? "–"} · caption {ev.ocr_caption_query ?? "–"} ·
                handle {ev.handle_watermark ?? "–"} · predates {ev.predates_input ?? "–"}
              </p>
              {cand.url && (
                <p style={{ margin: "6px 0 0" }}>
                  <a href={cand.url} target="_blank" rel="noopener noreferrer">
                    open in Telegram
                  </a>
                </p>
              )}
              {Array.isArray(cand.caveats) && cand.caveats.length > 0 && (
                <ul style={{ margin: "6px 0 0", paddingLeft: 18, fontSize: 12, color: "#777" }}>
                  {cand.caveats.map((c, i) => (
                    <li key={i}>{c}</li>
                  ))}
                </ul>
              )}
            </div>
          );
        }

        // --- main component -----------------------------------------------------------

        export default function Dashboard({ sinas }) {
          const [stage, setStage] = useState("configure");
          const [mode, setMode] = useState("demo");
          const [job, setJob] = useState(null);
          const [report, setReport] = useState(null);
          const [status, setStatus] = useState("idle");
          const [executionId, setExecutionId] = useState(null);
          const [error, setError] = useState(null);
          const pollRef = useRef(null);

          const stopPolling = useCallback(() => {
            if (pollRef.current) {
              clearInterval(pollRef.current);
              pollRef.current = null;
            }
          }, []);

          useEffect(() => stopPolling, [stopPolling]); // clear timer on unmount

          // Clear any in-flight poll + stale run state before starting a fresh job, so a
          // second run can't show a leftover execution id / report from the first.
          const resetRun = useCallback(() => {
            stopPolling();
            setError(null);
            setReport(null);
            setExecutionId(null);
          }, [stopPolling]);

          // Demo mode: synthesize a short progression, then show the bundled report —
          // fully offline, no client needed.
          const runDemo = useCallback(() => {
            resetRun();
            setStatus("analyzing");
            setJob({ job_id: DEMO_REPORT.job_id, status: "analyzing", mode: "demo" });
            setExecutionId("exec_demo");
            setStage("progress");
            const steps = ["analyzing", "searching", "verifying", "ranking", "reporting", "done"];
            let i = 0;
            pollRef.current = setInterval(() => {
              i += 1;
              const s = steps[Math.min(i, steps.length - 1)];
              setStatus(s);
              setJob((j) => ({ ...(j || {}), status: s }));
              if (s === "done") {
                stopPolling();
                setReport(DEMO_REPORT);
                setStage("report");
              }
            }, 500);
          }, [resetRun, stopPolling]);

          // Live/hybrid: create the job, then render the report. The long analysis step
          // is async — kick it off, then poll the execution for visible progress (#20).
          const runLive = useCallback(async () => {
            resetRun();
            setStatus("creating");
            try {
              const created = await callFunction(sinas, "clip2trace/create_job", { mode });
              const jobId = created.job_id || (created.result && created.result.job_id);
              setJob({ job_id: jobId, status: "created", mode });
              setStage("progress");

              // Enqueue the report build (stands in for the long async pipeline). When a
              // real execution_id comes back, poll it; otherwise we already have a result.
              setStatus("analyzing");
              const enq = await enqueueFunction(sinas, "clip2trace/render_report", {
                job_id: jobId,
                mode,
              });
              if (enq.execution_id) {
                setExecutionId(enq.execution_id);
                stopPolling();
                pollRef.current = setInterval(async () => {
                  try {
                    const ex = await getExecution(sinas, enq.execution_id);
                    setStatus(ex.status || "running");
                    if (ex.status === "completed" || ex.status === "succeeded") {
                      stopPolling();
                      setReport(ex.result || ex.output);
                      setStage("report");
                    } else if (ex.status === "failed" || ex.status === "error") {
                      stopPolling();
                      setError(ex.error || "execution failed");
                    }
                  } catch (e) {
                    stopPolling();
                    setError(String((e && e.message) || e));
                  }
                }, 2000);
              } else {
                setStatus("done");
                setReport(enq.result);
                setStage("report");
              }
            } catch (e) {
              setError(String((e && e.message) || e));
              setStatus("failed");
            }
          }, [sinas, mode, resetRun, stopPolling]);

          function startJob() {
            if (mode === "demo" || !sinas) {
              runDemo();
            } else {
              runLive();
            }
          }

          // render_report returns a {report_json, summary, ...} wrapper; demo passes the
          // inner shape directly. Normalize to the report_json so fields resolve in both.
          const reportJson = (report && report.report_json) || report || null;
          const segments = (reportJson && reportJson.segments) || [];
          const candidates = (reportJson && reportJson.ranked_candidates) || [];
          const reportMode =
            (reportJson && (reportJson.generated_mode || reportJson.mode)) || mode;

          return (
            <div style={{ fontFamily: "system-ui", padding: 16, maxWidth: 920 }}>
              <header style={{ display: "flex", alignItems: "baseline", gap: 12 }}>
                <h1 style={{ margin: 0 }}>clip2trace</h1>
                <span style={{ color: "#777" }}>
                  Telegram source tracing for reused footage in edited videos
                </span>
              </header>

              <nav style={{ display: "flex", gap: 8, flexWrap: "wrap", margin: "12px 0" }}>
                {STATES.map((s) => (
                  <button key={s} disabled={s === stage} onClick={() => setStage(s)}>
                    {s}
                  </button>
                ))}
              </nav>

              {error && (
                <div style={{ background: "#7a2e2e", color: "#fff", padding: 10, borderRadius: 6 }}>
                  Error: {error}
                </div>
              )}

              {stage === "configure" && (
                <section>
                  <h2>1. Configure</h2>
                  <label>
                    Mode:{" "}
                    <select value={mode} onChange={(e) => setMode(e.target.value)}>
                      <option value="demo">demo</option>
                      <option value="hybrid">hybrid</option>
                      <option value="live">live</option>
                    </select>
                  </label>
                  <p style={{ color: "#777" }}>
                    Instance: {sinas ? "connected" : "not connected — demo mode only"}
                  </p>
                  <button onClick={() => setStage("start")}>Next</button>
                </section>
              )}

              {stage === "select-video" && (
                <section>
                  <h2>2. Select input video</h2>
                  <p style={{ color: "#777" }}>
                    Live/hybrid runs upload to the <code>clip2trace/input-videos</code> collection;
                    demo mode needs no file.
                  </p>
                </section>
              )}

              {stage === "start" && (
                <section>
                  <h2>3. Start job</h2>
                  <p style={{ color: "#777" }}>Mode: {mode}</p>
                  <button onClick={startJob}>Start source-tracing job</button>
                </section>
              )}

              {stage === "progress" && (
                <section>
                  <h2>4. Job progress</h2>
                  <p>
                    job_id: <code>{(job && job.job_id) || "—"}</code>
                    {executionId && (
                      <>
                        {"  ·  execution_id: "}
                        <code>{executionId}</code>
                      </>
                    )}
                  </p>
                  <p>
                    status: <strong>{status}</strong> {pollRef.current ? "(polling…)" : ""}
                  </p>
                  <p style={{ color: "#777", fontSize: 13 }}>
                    Long analysis runs async (execute/async → poll /executions/&#123;id&#125;); failures
                    surface above.
                  </p>
                </section>
              )}

              {stage === "report" && (
                <section>
                  <h2>9. Provenance report</h2>
                  {!report && <p style={{ color: "#777" }}>No report yet — start a job.</p>}
                  {report && (
                    <>
                      <p>
                        {(report && report.summary) || (reportJson && reportJson.summary)}{" "}
                        <em style={{ color: "#777" }}>({reportMode} mode)</em>
                      </p>
                      <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
                        <div style={{ flex: "1 1 360px" }}>
                          <h3>Candidate source segments</h3>
                          {segments.length === 0 && <p style={{ color: "#777" }}>none</p>}
                          {segments.map((seg) => (
                            <SegmentCard key={seg.segment_id} seg={seg} />
                          ))}
                        </div>
                        <div style={{ flex: "1 1 360px" }}>
                          <h3>Likely Telegram source candidates</h3>
                          {candidates.length === 0 && <p style={{ color: "#777" }}>none</p>}
                          {candidates.map((c) => (
                            <CandidateCard key={c.candidate_id} cand={c} />
                          ))}
                        </div>
                      </div>
                      <p style={{ color: "#777", fontSize: 12, marginTop: 12 }}>
                        Likely candidates only — global search is retrieval, not proof. clip2trace never
                        claims to have found "the original".
                      </p>
                    </>
                  )}
                </section>
              )}
            </div>
          );
        }

  manifests:
    - namespace: clip2trace
      name: clip2trace
      description: Manifest for clip2trace — Telegram source tracing for reused footage.
      requiredResources:
        - { type: function, namespace: clip2trace, name: create_job }
        - { type: function, namespace: clip2trace, name: diagnose_runtime }
        - { type: function, namespace: clip2trace, name: analyze_input_video }
        - { type: function, namespace: clip2trace, name: detect_source_segments }
        - { type: function, namespace: clip2trace, name: extract_segment_clues }
        - { type: function, namespace: clip2trace, name: cluster_segments }
        - { type: function, namespace: clip2trace, name: generate_telegram_queries }
        - { type: function, namespace: clip2trace, name: search_global_telegram_posts }
        - { type: function, namespace: clip2trace, name: fetch_telegram_candidate_media }
        - { type: function, namespace: clip2trace, name: verify_media_similarity }
        - { type: function, namespace: clip2trace, name: rank_source_candidates }
        - { type: function, namespace: clip2trace, name: render_report }
        - { type: agent, namespace: clip2trace, name: coordinator }
        - { type: agent, namespace: clip2trace, name: source-segment-analyst }
        - { type: agent, namespace: clip2trace, name: telegram-query-planner }
        - { type: agent, namespace: clip2trace, name: evidence-ranker }
        - { type: agent, namespace: clip2trace, name: report-writer }
        - { type: skill, namespace: clip2trace, name: telegram-source-tracing }
        - { type: skill, namespace: clip2trace, name: evidence-scoring-rubric }
        - { type: skill, namespace: clip2trace, name: report-style }
        - { type: collection, namespace: clip2trace, name: input-videos }
        - { type: collection, namespace: clip2trace, name: source-segments }
        - { type: collection, namespace: clip2trace, name: keyframes }
        - { type: collection, namespace: clip2trace, name: telegram-media }
        - { type: collection, namespace: clip2trace, name: reports }
        - { type: collection, namespace: clip2trace, name: demo-fixtures }
      # NOTE: manifest requiredResources only supports agent|collection|function|skill
      # (per `sinas validate`). Stores + the dashboard component are declared in
      # spec.stores / spec.components and created at install, but are NOT listed here.
      requiredPermissions:
        - clip2trace.jobs.write:all
        - clip2trace.jobs.read:all
        - clip2trace.reports.read:all
      optionalPermissions:
        - clip2trace.telegram.search:all
      # Expose the package's resources for the manifest-scoped SDK/app path
      # (X-Application header). Without this, app-context calls are filtered to
      # an empty set even with correct permissions. See #44 and
      # docs/research/runtime-diagnostics.md. Format is {resourceType: [namespaces]}.
      exposedNamespaces:
        functions: [clip2trace]
        agents: [clip2trace]
        components: [clip2trace]
      storeDependencies: []

  dependencies:
    - { packageName: numpy }
    - { packageName: pillow }
    - { packageName: imagehash }
    - { packageName: rapidfuzz }
    - { packageName: python-dateutil }
    - { packageName: requests }
    # PyAV bundles ffmpeg in its wheel → self-contained decode on the managed
    # worker (no system libGL/ffmpeg). opencv/scenedetect are preferred-if-present.
    - { packageName: av }
    # Video + Telegram deps require admin approval and larger containers; see docs/risks.md:
    - { packageName: opencv-python-headless }
    - { packageName: scenedetect }
    - { packageName: telethon }
