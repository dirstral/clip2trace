apiVersion: sinas.co/v1
kind: SinasPackage
package:
  name: clip2trace
  version: "0.1.0"
  description: Telegram source tracing for reused footage in edited videos.
  author: dirstral
  url: https://github.com/dirstral/clip2trace

# ---------------------------------------------------------------------------
# NOTE on inferred field names:
#   The Sinas package-author skill ships verbatim YAML only for functions,
#   agents, queries, connectors, variables and manifests. The field names used
#   below for collections / stores / components are the camelCase form of the
#   documented (snake_case) API properties and have NOT been seen in a verbatim
#   package example. `sinas validate` against the live instance is the source of
#   truth — see docs/research/sinas-investigation.md. Unknown keys are rejected
#   by the strict schema, so adjust here if validation complains.
# ---------------------------------------------------------------------------

spec:
  variables:
    - name: PRIMARY_LLM
      type: resource_ref
      resource: llm_providers
      description: Claude provider used by all clip2trace agents.
      required: true
    - name: ENABLE_TELEGRAM_LIVE_SEARCH
      type: boolean
      description: Enable live global Telegram search via Telethon. Default off (demo mode).
      default: false
      required: false
    - name: MAX_VIDEO_MB
      type: text
      description: Soft cap on input video size in MB. (No numeric var type; stored as text.)
      default: "500"
      required: false
    - name: TELEGRAM_API_ID
      type: secret
      description: Telegram API id (my.telegram.org). Required only when live search is enabled.
      required: false
    - name: TELEGRAM_API_HASH
      type: secret
      description: Telegram API hash. Required only when live search is enabled.
      required: false
    - name: TELEGRAM_SESSION_STRING
      type: secret
      description: Telethon StringSession for a USER account. Required only when live search is enabled.
      required: false

  collections:
    - namespace: clip2trace
      name: input-videos
      metadataSchema:
        type: object
        properties:
          job_id: { type: string }
          duration_sec: { type: number }
    - namespace: clip2trace
      name: source-segments
      metadataSchema:
        type: object
        properties:
          job_id: { type: string }
          segment_id: { type: string }
    - namespace: clip2trace
      name: keyframes
      metadataSchema:
        type: object
        properties:
          segment_id: { type: string }
    - namespace: clip2trace
      name: telegram-media
      metadataSchema:
        type: object
        properties:
          candidate_id: { type: string }
    - namespace: clip2trace
      name: reports
      metadataSchema:
        type: object
        properties:
          job_id: { type: string }
    - namespace: clip2trace
      name: demo-fixtures
      metadataSchema:
        type: object
        properties:
          fixture: { type: string }

  stores:
    - namespace: clip2trace
      name: jobs
      description: Job records keyed by job_id (status, progress, input metadata, errors).
      visibility: shared
    - namespace: clip2trace
      name: segments
      description: Candidate source segments per job.
      visibility: shared
    - namespace: clip2trace
      name: search-results
      description: Telegram search hits per query.
      visibility: shared
    - namespace: clip2trace
      name: candidate-matches
      description: Media-similarity match results per candidate.
      visibility: shared
    - namespace: clip2trace
      name: query-cache
      description: Cached Telegram query->results to avoid repeated live searches.
      visibility: shared
    - namespace: clip2trace
      name: runtime-diagnostics
      description: Output of diagnose_runtime capability probes.
      visibility: shared

  functions:
    - namespace: clip2trace
      name: create_job
      description: Create a source-tracing job for one input video.
      timeout: 30
      inputSchema:
        type: object
        properties:
          input_video_file_id: { type: string }
          video_context: { type: string }
          date_hint: { type: string }
          language_hint: { type: string }
          topic_hint: { type: string }
          mode: { type: string, enum: [demo, live, hybrid], default: demo }
      code: |
        def handler(input_data, context):
            mode = input_data.get("mode", "demo")
            if mode not in ("demo", "live", "hybrid"):
                return {"error": "mode must be demo|live|hybrid"}
            exec_id = (context or {}).get("execution_id", "local")
            job_id = "job_" + str(exec_id)
            meta_fields = ("input_video_file_id", "video_context", "date_hint",
                           "language_hint", "topic_hint")
            state = {"job_id": job_id, "status": "created", "mode": mode,
                     "progress": 0.0, "error": None,
                     "next_step": "analyze_input_video"}
            for k in meta_fields:
                state[k] = input_data.get(k)
            return state

    - namespace: clip2trace
      name: diagnose_runtime
      description: Probe runtime capabilities (libs, tools, disk, secrets access).
      sharedPool: true
      timeout: 30
      inputSchema:
        type: object
        properties: {}
      code: |
        def handler(input_data, context):
            import importlib, shutil, sys, tempfile, os
            def has_mod(m):
                try:
                    importlib.import_module(m); return True
                except Exception:
                    return False
            tmp = tempfile.gettempdir()
            try:
                free = shutil.disk_usage(tmp).free
            except Exception:
                free = None
            return {
                "python": sys.version.split()[0],
                "modules": {m: has_mod(m) for m in
                            ["av", "cv2", "scenedetect", "imagehash", "PIL",
                             "numpy", "telethon", "rapidfuzz", "dateutil",
                             "requests"]},
                "tools": {"ffmpeg": bool(shutil.which("ffmpeg")),
                          "tesseract": bool(shutil.which("tesseract"))},
                "tmp_dir": tmp, "tmp_free_bytes": free,
                "has_access_token": bool((context or {}).get("access_token")),
                "secrets_available": "secrets" in (context or {}),
                "env_keys": sorted(os.environ.keys()),
                "context_keys": sorted((context or {}).keys()),
            }

    - namespace: clip2trace
      name: analyze_input_video
      description: High-level orchestration of input-video analysis into source segments.
      timeout: 300
      inputSchema:
        type: object
        properties:
          job_id: { type: string }
          input_video_file_id: { type: string }
          video_path: { type: string }
          duration_sec: { type: number }
          mode: { type: string, default: demo }
        required: [job_id]
      code: |
        def handler(input_data, context):
            job_id = input_data.get("job_id")
            if not job_id:
                return {"error": "job_id is required"}
            mode = input_data.get("mode", "demo")
            video_path = input_data.get("video_path")
            duration = input_data.get("duration_sec")
            diagnostics = []
            segments, method = [], "demo_fixture"

            def windows_to_segments(wins, likelihood, reason):
                return [{"segment_id": "seg_%03d" % i,
                         "start_sec": round(float(w["start_sec"]), 2),
                         "end_sec": round(float(w["end_sec"]), 2),
                         "source_likelihood": likelihood, "reason": reason}
                        for i, w in enumerate(wins, 1)]

            if video_path:
                try:
                    from scenedetect import detect, ContentDetector
                    scenes = detect(video_path, ContentDetector())
                    def _secs(tc):
                        return tc.seconds if hasattr(tc, "seconds") else tc.get_seconds()
                    wins = [{"start_sec": _secs(s), "end_sec": _secs(e)}
                            for s, e in scenes]
                    segments = windows_to_segments(
                        wins, 0.5, "shot boundary; candidate reused footage")
                    method = "shot_detection"
                except Exception as exc:
                    diagnostics.append("shot detection unavailable: %r" % (exc,))
                if not segments:
                    try:
                        import av, numpy as np
                        c = av.open(video_path)
                        try:
                            vs = c.streams.video[0]; tb = vs.time_base
                            prev = None; cuts = [0.0]; last = 0.0; nxt = 0.0
                            for fr in c.decode(vs):
                                tt = float(fr.pts * tb) if fr.pts is not None else last
                                last = tt
                                if tt + 1e-9 < nxt:
                                    continue
                                nxt = tt + 1.0 / 3.0
                                a = fr.to_ndarray(format="gray8")
                                sc = max(1, int(max(a.shape) / 128))
                                sm = a[::sc, ::sc].astype("float32") / 255.0
                                if (prev is not None and prev.shape == sm.shape
                                        and float(np.mean(np.abs(sm - prev))) > 0.3):
                                    cuts.append(tt)
                                prev = sm
                            dur = float(vs.duration * tb) if vs.duration else last
                        finally:
                            c.close()
                        b = sorted(set(cuts + [dur]))
                        wins = [{"start_sec": round(x, 2), "end_sec": round(y, 2)}
                                for x, y in zip(b, b[1:]) if y - x > 0.1]
                        if wins:
                            segments = windows_to_segments(
                                wins, 0.4, "scene cut (pyav); candidate reused footage")
                            method = "shot_detection_pyav"
                    except Exception as exc2:
                        diagnostics.append("pyav shot detection unavailable: %r" % (exc2,))

            if not segments and duration:
                t, wins = 0.0, []
                while t < float(duration):
                    wins.append({"start_sec": round(t, 2),
                                 "end_sec": round(min(t + 8.0, float(duration)), 2)})
                    t += 8.0
                segments = windows_to_segments(
                    wins, 0.3, "uniform window; candidate reused footage")
                method = "uniform_windows"

            if not segments:
                segments = [
                    {"segment_id": "seg_001", "start_sec": 12.0, "end_sec": 24.5,
                     "source_likelihood": 0.81, "reason": "candidate reused footage",
                     "phashes": ["c3e1c3e1c3e1c3e1"], "ocr_text": "LIVE FROM DEMO",
                     "visible_handles": ["@demo_channel"],
                     "context_terms": ["demo", "street", "crowd"]},
                    {"segment_id": "seg_002", "start_sec": 58.2, "end_sec": 67.0,
                     "source_likelihood": 0.64, "reason": "candidate reused footage",
                     "phashes": ["5a5a5a5a5a5a5a5a"], "ocr_text": "",
                     "visible_handles": [], "context_terms": []}]

            return {"job_id": job_id, "status": "analyzed", "mode": mode,
                    "method": method, "segments": segments,
                    "diagnostics": diagnostics,
                    "next_step": "extract_segment_clues"}

    - namespace: clip2trace
      name: detect_source_segments
      description: Detect candidate reused-footage windows in the input video.
      timeout: 300
      inputSchema:
        type: object
        properties:
          job_id: { type: string }
          input_video_file_id: { type: string }
          video_path: { type: string }
          duration_sec: { type: number }
        required: [job_id]
      code: |
        def handler(input_data, context):
            if not input_data.get("job_id"):
                return {"error": "job_id is required"}
            video_path = input_data.get("video_path")
            duration = input_data.get("duration_sec")
            diagnostics = []

            def windows_to_segments(wins, likelihood, reason):
                return [{"segment_id": "seg_%03d" % i,
                         "start_sec": round(float(w["start_sec"]), 2),
                         "end_sec": round(float(w["end_sec"]), 2),
                         "source_likelihood": likelihood, "reason": reason}
                        for i, w in enumerate(wins, 1)]

            if video_path:
                try:
                    from scenedetect import detect, ContentDetector
                    scenes = detect(video_path, ContentDetector())
                    def _secs(tc):
                        return tc.seconds if hasattr(tc, "seconds") else tc.get_seconds()
                    wins = [{"start_sec": _secs(s), "end_sec": _secs(e)}
                            for s, e in scenes]
                    return {"segments": windows_to_segments(
                                wins, 0.5, "shot boundary; candidate reused footage"),
                            "method": "shot_detection", "implemented": True}
                except Exception as exc:
                    diagnostics.append("shot detection unavailable: %r" % (exc,))
                try:
                    import av, numpy as np
                    c = av.open(video_path)
                    try:
                        vs = c.streams.video[0]; tb = vs.time_base
                        prev = None; cuts = [0.0]; last = 0.0; nxt = 0.0
                        for fr in c.decode(vs):
                            tt = float(fr.pts * tb) if fr.pts is not None else last
                            last = tt
                            if tt + 1e-9 < nxt:
                                continue
                            nxt = tt + 1.0 / 3.0
                            a = fr.to_ndarray(format="gray8")
                            sc = max(1, int(max(a.shape) / 128))
                            sm = a[::sc, ::sc].astype("float32") / 255.0
                            if (prev is not None and prev.shape == sm.shape
                                    and float(np.mean(np.abs(sm - prev))) > 0.3):
                                cuts.append(tt)
                            prev = sm
                        dur = float(vs.duration * tb) if vs.duration else last
                    finally:
                        c.close()
                    b = sorted(set(cuts + [dur]))
                    wins = [{"start_sec": round(x, 2), "end_sec": round(y, 2)}
                            for x, y in zip(b, b[1:]) if y - x > 0.1]
                    if wins:
                        return {"segments": windows_to_segments(
                                    wins, 0.4, "scene cut (pyav); candidate reused footage"),
                                "method": "shot_detection_pyav",
                                "implemented": True, "diagnostics": diagnostics}
                except Exception as exc2:
                    diagnostics.append("pyav shot detection unavailable: %r" % (exc2,))

            if duration:
                t, wins = 0.0, []
                while t < float(duration):
                    wins.append({"start_sec": round(t, 2),
                                 "end_sec": round(min(t + 8.0, float(duration)), 2)})
                    t += 8.0
                return {"segments": windows_to_segments(
                            wins, 0.3, "uniform window; candidate reused footage"),
                        "method": "uniform_windows", "implemented": True,
                        "diagnostics": diagnostics}

            return {"segments": [
                {"segment_id": "seg_001", "start_sec": 12.0, "end_sec": 24.5,
                 "source_likelihood": 0.81, "reason": "candidate reused footage",
                 "phashes": ["c3e1c3e1c3e1c3e1"], "ocr_text": "LIVE FROM DEMO",
                 "visible_handles": ["@demo_channel"],
                 "context_terms": ["demo", "street", "crowd"]},
                {"segment_id": "seg_002", "start_sec": 58.2, "end_sec": 67.0,
                 "source_likelihood": 0.64, "reason": "candidate reused footage",
                 "phashes": ["5a5a5a5a5a5a5a5a"], "ocr_text": "",
                 "visible_handles": [], "context_terms": []}],
                "method": "demo_fixture", "implemented": True,
                "diagnostics": diagnostics}

    - namespace: clip2trace
      name: extract_segment_clues
      description: Extract keyframes, perceptual hashes, OCR text and visible handles.
      timeout: 300
      inputSchema:
        type: object
        properties:
          job_id: { type: string }
          segment_id: { type: string }
          text_hint: { type: string }
          caption: { type: string }
          ocr_text: { type: string }
          video_path: { type: string }
          start_sec: { type: number }
          end_sec: { type: number }
          phashes: { type: array, items: { type: string } }
          keyframe_file_ids: { type: array, items: { type: string } }
        required: [job_id, segment_id]
      code: |
        def handler(input_data, context):
            import re
            if not input_data.get("job_id") or not input_data.get("segment_id"):
                return {"error": "job_id and segment_id are required"}
            HANDLE_RE = re.compile(r"@([A-Za-z][A-Za-z0-9_]{3,31})")
            HASHTAG_RE = re.compile(r"#(\w{2,64})")
            WORD_RE = re.compile(r"[A-Za-z][A-Za-z0-9]{2,}")
            STOPWORDS = {"the", "and", "for", "with", "this", "that", "from",
                         "video", "live", "breaking", "news", "watch", "today",
                         "footage"}
            text_hint = input_data.get("text_hint", "") or ""
            caption = input_data.get("caption", "") or ""
            ocr_text = input_data.get("ocr_text", "") or ""
            phashes = list(input_data.get("phashes") or [])
            keyframe_file_ids = list(input_data.get("keyframe_file_ids") or [])
            video_path = input_data.get("video_path")
            start, end = input_data.get("start_sec"), input_data.get("end_sec")
            diagnostics = []

            # #10 visual: keyframes -> perceptual hashes (full + center-crop).
            # Decode with OpenCV if present, else PyAV (bundles ffmpeg; no system
            # libGL). Hash with Pillow+imagehash only (no OpenCV needed).
            keyframes_rgb = []
            if video_path and start is not None and end is not None:
                s, e, n = float(start), float(end), 3
                step = (e - s) / (n + 1)
                targets = [s + step * i for i in range(1, n + 1)]
                try:
                    import cv2
                    cap = cv2.VideoCapture(video_path)
                    try:
                        for t in targets:
                            cap.set(cv2.CAP_PROP_POS_MSEC, t * 1000.0)
                            ok, frame = cap.read()
                            if ok:
                                keyframes_rgb.append(
                                    cv2.cvtColor(frame, cv2.COLOR_BGR2RGB))
                    finally:
                        cap.release()
                except Exception:
                    try:
                        import av
                        container = av.open(video_path)
                        try:
                            vstream = container.streams.video[0]
                            tb = vstream.time_base
                            for t in targets:
                                try:
                                    container.seek(int(t / tb), stream=vstream,
                                                   backward=True)
                                except Exception:
                                    pass
                                picked = None
                                for fr in container.decode(vstream):
                                    picked = fr
                                    ft = (float(fr.pts * tb)
                                          if fr.pts is not None else t)
                                    if ft >= t:
                                        break
                                if picked is not None:
                                    keyframes_rgb.append(
                                        picked.to_ndarray(format="rgb24"))
                        finally:
                            container.close()
                    except Exception as exc:
                        diagnostics.append(
                            "keyframe extraction unavailable: %r" % (exc,))
                try:
                    import imagehash
                    from PIL import Image
                    for rgb in keyframes_rgb:
                        phashes.append(str(imagehash.phash(Image.fromarray(rgb))))
                        h, w = rgb.shape[:2]
                        ch, cw = int(h * 0.6), int(w * 0.6)
                        y0, x0 = (h - ch) // 2, (w - cw) // 2
                        crop = rgb[y0:y0 + ch, x0:x0 + cw]
                        phashes.append(str(imagehash.phash(Image.fromarray(crop))))
                except Exception as exc:
                    diagnostics.append("hashing unavailable: %r" % (exc,))

            # #11 OCR: tesseract if present, else Claude vision via the OpenAI
            # adapter (no system binary). Supplied ocr_text always wins.
            ocr_available = False
            if not ocr_text and keyframes_rgb:
                try:
                    import importlib
                    pytess = importlib.import_module("pytesseract")
                    from PIL import Image
                    ocr_text = (pytess.image_to_string(
                        Image.fromarray(keyframes_rgb[0])) or "").strip()
                    ocr_available = bool(ocr_text)
                except Exception:
                    pass
            if not ocr_text and keyframes_rgb:
                try:
                    import base64, io, os, json, urllib.request
                    from PIL import Image
                    ctx = context or {}
                    base = (ctx.get("api_url") or ctx.get("base_url")
                            or os.environ.get("SINAS_BASE_URL"))
                    token = ctx.get("access_token")
                    if base and token:
                        buf = io.BytesIO()
                        Image.fromarray(keyframes_rgb[0]).save(buf, format="PNG")
                        b64 = base64.b64encode(buf.getvalue()).decode("ascii")
                        body = json.dumps({"model": "claude-sonnet-4-6",
                            "max_tokens": 512, "messages": [{"role": "user",
                            "content": [{"type": "text", "text":
                                "Output ONLY the visible on-screen text in this "
                                "video frame, verbatim. No preamble or markdown. "
                                "If none, output nothing."},
                                {"type": "image", "source": {"type": "base64",
                                 "media_type": "image/png", "data": b64}}]}]}).encode()
                        req = urllib.request.Request(
                            base.rstrip("/") + "/adapters/openai/v1/chat/completions",
                            data=body, method="POST",
                            headers={"Authorization": "Bearer " + token,
                                     "Content-Type": "application/json"})
                        resp = urllib.request.urlopen(req, timeout=60)
                        data = json.loads(resp.read())
                        ocr_text = (data["choices"][0]["message"]["content"]
                                    or "").strip()
                        ocr_available = bool(ocr_text)
                except Exception as exc:
                    diagnostics.append("llm ocr unavailable: %r" % (exc,))
            if not ocr_available:
                ocr_available = bool(ocr_text)

            # #11 text: handles + context terms (OCR text now folded in).
            blob = " ".join([text_hint, caption, ocr_text])
            handles, seen = [], set()
            for m in HANDLE_RE.findall(blob):
                if m.lower() not in seen:
                    seen.add(m.lower())
                    handles.append(m)
            cleaned = HASHTAG_RE.sub(" ", HANDLE_RE.sub(" ", blob))
            context_terms, seen = [], set()
            for w in WORD_RE.findall(cleaned):
                k = w.lower()
                if k in STOPWORDS or k in seen:
                    continue
                seen.add(k)
                context_terms.append(w)
                if len(context_terms) >= 8:
                    break

            return {"segment_id": input_data.get("segment_id"),
                    "keyframe_file_ids": keyframe_file_ids, "phashes": phashes,
                    "ocr_text": ocr_text, "visible_handles": handles,
                    "context_terms": context_terms, "ocr_available": ocr_available,
                    "diagnostics": diagnostics, "implemented": True}

    - namespace: clip2trace
      name: generate_telegram_queries
      description: Turn segment clues into a small ranked Telegram query set.
      timeout: 30
      inputSchema:
        type: object
        properties:
          visible_handles: { type: array, items: { type: string } }
          ocr_text: { type: string }
          context_terms: { type: array, items: { type: string } }
          caption: { type: string }
      code: |
        def handler(input_data, context):
            qs, seen = [], set()
            def add(q, t, p, r):
                k = (q or "").strip().lower()
                if q and k not in seen:
                    seen.add(k)
                    qs.append({"query": q, "query_type": t, "priority": p, "reason": r})
            for h in (input_data.get("visible_handles") or []):
                add("@" + str(h).lstrip("@"), "handle", 1, "Exact handle is strongest signal.")
            ocr = (input_data.get("ocr_text") or "").strip()
            if 0 < len(ocr) <= 120:
                add(ocr, "ocr_exact", 2, "Exact on-screen text.")
            for term in (input_data.get("context_terms") or []):
                add(term, "context", 3, "Contextual term.")
            qs.sort(key=lambda x: x["priority"])
            return {"queries": qs}

    - namespace: clip2trace
      name: search_global_telegram_posts
      description: Global Telegram post search (live via Telethon) or demo/cached fallback.
      sharedPool: true
      timeout: 120
      inputSchema:
        type: object
        properties:
          queries: { type: array, items: { type: object } }
          mode: { type: string, default: demo }
          cached_results: { type: array, items: { type: object } }
          manual_urls: { type: array, items: { type: string } }
      code: |
        # Self-contained: the sandbox can't import clip2trace. Mirrors
        # src/clip2trace/telegram_live.py. channels.searchPosts is user-only;
        # hashtag is unmetered, free-text is metered (we never spend Stars).
        def handler(input_data, context):
            input_data = input_data or {}
            context = context or {}
            mode = input_data.get("mode", "demo")
            queries = input_data.get("queries") or []
            manual = input_data.get("manual_urls") or []
            if manual:
                return {"status": "ok", "source": "manual_urls",
                        "candidates": [{"candidate_id": "manual_%d" % i, "url": u}
                                       for i, u in enumerate(manual)]}
            cached = input_data.get("cached_results")
            if cached is not None:
                return {"status": "ok", "source": "cached", "candidates": cached}
            if mode in ("live", "hybrid"):
                secrets = context.get("secrets") or {}
                api_id = secrets.get("TELEGRAM_API_ID")
                api_hash = secrets.get("TELEGRAM_API_HASH")
                session = secrets.get("TELEGRAM_SESSION_STRING")
                if not (api_id and api_hash and session):
                    return {"status": "live_unavailable", "source": "none",
                            "candidates": [], "diagnostics":
                            ["missing Telegram secrets/session or not sharedPool"]}
                try:
                    from telethon.sync import TelegramClient
                    from telethon.sessions import StringSession
                    from telethon import functions, types
                    from telethon.errors import FloodWaitError
                except Exception as exc:
                    return {"status": "live_unavailable", "source": "none",
                            "candidates": [], "diagnostics":
                            ["telethon unavailable: %r" % (exc,)]}
                results, seen, diags = [], set(), []
                try:
                    with TelegramClient(StringSession(session), int(api_id), api_hash) as client:
                        for q in queries:
                            text = (q.get("query") or "").strip()
                            if not text:
                                continue
                            if q.get("query_type") == "hashtag" or text.startswith("#"):
                                hashtag, query = text.lstrip("#"), None
                            else:
                                hashtag, query = None, text
                            offset_rate, offset_id, pages = 0, 0, 0
                            try:
                                while pages < 5 and len(results) < 50:
                                    res = client(functions.channels.SearchPostsRequest(
                                        hashtag=hashtag, query=query, offset_rate=offset_rate,
                                        offset_peer=types.InputPeerEmpty(),
                                        offset_id=offset_id, limit=100))
                                    msgs = list(getattr(res, "messages", []) or [])
                                    if not msgs:
                                        break
                                    chats = {getattr(c, "id", None): c
                                             for c in (getattr(res, "chats", []) or [])}
                                    for m in msgs:
                                        peer = getattr(m, "peer_id", None)
                                        ch = chats.get(getattr(peer, "channel_id", None))
                                        user = getattr(ch, "username", None) if ch else None
                                        mid = getattr(m, "id", None)
                                        key = "%s_%s" % (user or "unknown", mid)
                                        if key in seen:
                                            continue
                                        seen.add(key)
                                        date = getattr(m, "date", None)
                                        results.append({
                                            "candidate_id": key, "channel": user,
                                            "message_id": mid,
                                            "url": ("https://t.me/%s/%s" % (user, mid))
                                                   if user and mid else None,
                                            "posted_at": date.isoformat()
                                                         if hasattr(date, "isoformat") else None,
                                            "caption": getattr(m, "message", "") or "",
                                            "has_media": getattr(m, "media", None) is not None,
                                            "is_forward": getattr(m, "fwd_from", None) is not None,
                                            "accessible": True, "source_query": q.get("query")})
                                    nr = getattr(res, "next_rate", None)
                                    if not nr:
                                        break
                                    offset_rate = nr
                                    offset_id = getattr(msgs[-1], "id", 0) or 0
                                    pages += 1
                            except FloodWaitError as exc:
                                diags.append("flood wait %ss; stopping" %
                                             getattr(exc, "seconds", "?"))
                                break
                            except Exception as exc:
                                diags.append("query failed %r: %r" % (q.get("query"), exc))
                    return {"status": "ok", "source": "live",
                            "candidates": results, "diagnostics": diags}
                except Exception as exc:
                    return {"status": "live_unavailable", "source": "none",
                            "candidates": [], "diagnostics":
                            ["live search error: %r" % (exc,)]}
            return {"status": "demo_no_data", "source": "none", "candidates": [],
                    "diagnostics": ["demo mode and no cached_results/manual_urls supplied"]}

    - namespace: clip2trace
      name: fetch_telegram_candidate_media
      description: Fetch candidate metadata and optionally bounded media (dry-run by default).
      sharedPool: true
      timeout: 120
      inputSchema:
        type: object
        properties:
          candidates: { type: array, items: { type: object } }
          dry_run: { type: boolean, default: true }
      code: |
        # Self-contained mirror of clip2trace.telegram_media + telegram_live
        # download_candidates. Dry-run by default (metadata only); bounded live
        # download needs sharedPool secrets + telethon. Downloads work with the
        # user session; bounded by per-file cap, count, and /tmp byte budget.
        def handler(input_data, context):
            input_data = input_data or {}
            context = context or {}
            cands = input_data.get("candidates") or []
            dry_run = input_data.get("dry_run", True)

            def _norm(c):
                ch, mid = c.get("channel"), c.get("message_id")
                url = c.get("url")
                if not url and ch and mid:
                    url = "https://t.me/%s/%s" % (str(ch).lstrip("@"), mid)
                return {"candidate_id": c.get("candidate_id", "cand_unknown"),
                        "channel": ch, "message_id": mid, "url": url,
                        "caption": c.get("caption", ""),
                        "has_media": bool(c.get("has_media")),
                        "media_file_id": c.get("media_file_id"),
                        "accessible": c.get("accessible", True)}

            out = [_norm(c) for c in cands]
            if dry_run:
                return {"status": "metadata_only", "candidates": out, "downloaded": 0}

            secrets = context.get("secrets") or {}
            api_id = secrets.get("TELEGRAM_API_ID")
            api_hash = secrets.get("TELEGRAM_API_HASH")
            session = secrets.get("TELEGRAM_SESSION_STRING")
            if not (api_id and api_hash and session):
                return {"status": "metadata_only", "candidates": out,
                        "downloaded": 0,
                        "diagnostics": ["no Telegram secrets/session; metadata only"]}
            try:
                from telethon.sync import TelegramClient
                from telethon.sessions import StringSession
                from telethon.errors import FloodWaitError
            except Exception as exc:
                return {"status": "metadata_only", "candidates": out,
                        "downloaded": 0,
                        "diagnostics": ["telethon unavailable: %r" % (exc,)]}

            max_media, max_bytes, total_budget = 5, 8000000, 80000000
            inaccessible = ("ChannelPrivateError", "ChannelInvalidError",
                            "MsgIdInvalidError", "MediaEmptyError",
                            "FileIdInvalidError", "LocationInvalidError",
                            "UsernameInvalidError", "UsernameNotOccupiedError")
            downloaded, spent, diags = 0, 0, []
            try:
                with TelegramClient(StringSession(session), int(api_id), api_hash) as client:
                    for cand in out:
                        if downloaded >= max_media:
                            break
                        if not cand.get("has_media") or not cand.get("accessible"):
                            continue
                        ch, mid = cand.get("channel"), cand.get("message_id")
                        if not ch or not mid:
                            continue
                        try:
                            msg = client.get_messages(ch, ids=mid)
                            if msg is None:
                                cand["accessible"] = False
                                diags.append("%s/%s: not found or deleted" % (ch, mid))
                                continue
                            size = getattr(getattr(msg, "file", None), "size", None)
                            if size is not None and size > max_bytes:
                                diags.append("%s/%s: over per-file cap" % (ch, mid))
                                continue
                            if size and spent + size > total_budget:
                                diags.append("tmp byte budget reached; stopping")
                                break
                            path = client.download_media(msg, file="/tmp")
                            if path is None:
                                cand["accessible"] = False
                                diags.append("%s/%s: no downloadable media" % (ch, mid))
                                continue
                            cand["media_file_id"] = path
                            downloaded += 1
                            spent += size or 0
                        except FloodWaitError as exc:
                            diags.append("flood wait %ss; stopping" %
                                         getattr(exc, "seconds", "?"))
                            break
                        except Exception as exc:
                            cand["accessible"] = False
                            name = type(exc).__name__
                            diags.append("%s/%s: download failed (%s)" % (ch, mid,
                                         "inaccessible" if name in inaccessible else name))
                return {"status": "ok", "candidates": out,
                        "downloaded": downloaded, "diagnostics": diags}
            except Exception as exc:
                return {"status": "metadata_only", "candidates": out,
                        "downloaded": downloaded,
                        "diagnostics": ["live download error: %r" % (exc,)]}

    - namespace: clip2trace
      name: verify_media_similarity
      description: Compare segment keyframes vs candidate media (perceptual hash + text).
      timeout: 120
      inputSchema:
        type: object
        properties:
          segment_phashes: { type: array, items: { type: string } }
          candidate_phashes: { type: array, items: { type: string } }
          segment_text: { type: string }
          candidate_text: { type: string }
          segment_duration: { type: number }
          candidate_duration: { type: number }
      code: |
        def handler(input_data, context):
            def ham(a, b):
                return bin(int(a, 16) ^ int(b, 16)).count("1")
            sa = input_data.get("segment_phashes") or []
            sb = input_data.get("candidate_phashes") or []
            best, frames = 0.0, []
            for i, a in enumerate(sa):
                for j, b in enumerate(sb):
                    if len(a) != len(b):
                        continue
                    sim = max(0.0, 1.0 - ham(a, b) / 64.0)
                    if sim >= 0.85:
                        frames.append({"segment_frame": i, "candidate_frame": j,
                                       "similarity": round(sim, 4)})
                    best = max(best, sim)
            ta = set(str(input_data.get("segment_text", "")).lower().split())
            tb = set(str(input_data.get("candidate_text", "")).lower().split())
            text = len(ta & tb) / len(ta | tb) if ta and tb else 0.0
            sd = input_data.get("segment_duration") or 0.0
            cd = input_data.get("candidate_duration") or 0.0
            if sd and cd:
                r = min(float(sd), float(cd)) / max(float(sd), float(cd))
                temporal = max(0.0, (r - 0.75) / 0.25)
            else:
                temporal = 0.0
            overall = round(0.6 * best + 0.25 * text + 0.15 * temporal, 4)
            return {"visual_score": round(best, 4), "text_score": round(text, 4),
                    "temporal_score": round(temporal, 4), "overall_score": overall,
                    "matched_frames": frames}

    - namespace: clip2trace
      name: rank_source_candidates
      description: Apply the evidence scoring rubric and produce ranked candidates with caveats.
      timeout: 60
      inputSchema:
        type: object
        properties:
          candidates: { type: array, items: { type: object } }
      code: |
        def handler(input_data, context):
            W = {"visual_similarity": 0.40, "handle_watermark": 0.15,
                 "ocr_caption_query": 0.15, "predates_input": 0.15,
                 "temporal_alignment": 0.05, "channel_relevance": 0.05,
                 "forward_repost": 0.05}
            def label(s):
                for lo, name in [(0.85, "very_strong"), (0.70, "strong"),
                                 (0.50, "plausible"), (0.30, "weak")]:
                    if s >= lo:
                        return name
                return "reject"
            def evidence_for(c):
                ev = c.get("evidence")
                if ev:
                    return ev
                v = c.get("verification") or {}
                if v:
                    return {"visual_similarity": v.get("visual_score", 0.0),
                            "ocr_caption_query": v.get("text_score", 0.0),
                            "temporal_alignment": v.get("temporal_score", 0.0),
                            "handle_watermark": c.get("handle_match", 0.0),
                            "predates_input": c.get("predates_input", 0.0),
                            "channel_relevance": c.get("channel_relevance", 0.0),
                            "forward_repost": c.get("forward_repost", 0.0)}
                return {}
            steps = ["Open the Telegram link and confirm the media visually.",
                     "Check whether the post is itself a forward/repost.",
                     "Compare post timestamp against the input video's publication date."]
            out = []
            for c in (input_data.get("candidates") or []):
                ev = evidence_for(c)
                score = sum(W[k] * max(0.0, min(1.0, float(ev.get(k, 0.0)))) for k in W)
                out.append({"candidate_id": c.get("candidate_id"),
                            "confidence": round(score, 4),
                            "confidence_label": label(score),
                            "rejected": score < 0.30, "evidence": ev,
                            "caveats": ["Telegram post may itself be a repost.",
                                        "Automated score; verify manually."],
                            "recommended_next_steps": steps,
                            "url": c.get("url"),
                            "thumbnail_url": c.get("thumbnail_url")})
            out.sort(key=lambda x: x["confidence"], reverse=True)
            return {"ranked_candidates": out}

    - namespace: clip2trace
      name: render_report
      description: Build the provenance report JSON (cautious language, caveats included).
      timeout: 60
      inputSchema:
        type: object
        properties:
          job_id: { type: string }
          segments: { type: array, items: { type: object } }
          ranked_candidates: { type: array, items: { type: object } }
          mode: { type: string, default: demo }
          output_format: { type: string, enum: [json, html, both], default: json }
        required: [job_id]
      code: |
        def handler(input_data, context):
            import html as _html
            job_id = input_data.get("job_id")
            if not job_id:
                return {"error": "job_id is required"}
            ranked = input_data.get("ranked_candidates") or []
            kept = [c for c in ranked if not c.get("rejected")]
            mode = input_data.get("mode", "demo")
            report = {
                "job_id": job_id,
                "summary": ("Likely Telegram source candidates for human "
                            "verification; not confirmed sources."),
                "generated_mode": mode,
                "segments": input_data.get("segments") or [],
                "ranked_candidates": kept,
                "caveats": [
                    "Global Telegram search is retrieval, not proof of origin.",
                    "A matched post may itself be a repost.",
                    "Private/deleted posts are out of scope.",
                    "Confidence scores are automated; verify manually."]}
            result = {"report_json": report, "report_file_id": None,
                      "summary": report["summary"]}
            if input_data.get("output_format", "json") in ("html", "both"):
                def esc(x):
                    return _html.escape(str(x))
                cards = []
                for c in kept:
                    lbl = esc(c.get("confidence_label", "unknown"))
                    thumb = str(c.get("thumbnail_url") or "").strip()
                    img = ("<img src='%s' loading='lazy' alt='candidate media "
                           "thumbnail' style='max-width:160px;float:right'>"
                           % esc(thumb)) if thumb.lower().startswith(
                               ("http://", "https://")) else ""
                    url = c.get("url")
                    safe = str(url or "").strip()
                    if safe.lower().startswith(("http://", "https://")):
                        link = ('<a href="%s" rel="noopener noreferrer">%s</a>'
                                % (esc(safe), esc(safe)))
                    elif url:
                        link = esc(url)
                    else:
                        link = "(no link)"
                    cards.append("<div class='card %s'>%s<h3>%s — %s (%s)</h3>"
                                 "<p>%s</p></div>" % (
                                     lbl, img, esc(c.get("candidate_id")), lbl,
                                     esc(c.get("confidence", 0)), link))
                cav = "".join("<li>%s</li>" % esc(x) for x in report["caveats"])
                result["report_html"] = (
                    "<!doctype html><html lang='en'><head><meta charset='utf-8'>"
                    "<title>clip2trace provenance report — %s</title></head><body>"
                    "<h1>clip2trace provenance report</h1>"
                    "<p>job <code>%s</code> · mode <code>%s</code></p>"
                    "<p>%s</p><h2>Likely Telegram source candidates</h2>%s"
                    "<h2>Caveats</h2><ul>%s</ul>"
                    "<footer>Likely candidates for human verification — not "
                    "confirmed sources.</footer></body></html>" % (
                        esc(job_id), esc(job_id), esc(mode), esc(report["summary"]),
                        ("\n".join(cards) or "<p>No candidates retained.</p>"), cav))
            return result

  skills:
    - namespace: clip2trace
      name: telegram-source-tracing
      description: How to trace reused footage to likely Telegram source candidates.
      content: |
        See skills/telegram-source-tracing.md. Global Telegram search is
        retrieval, not proof. Visual verification is required. A Telegram post
        may be a repost. Private/deleted posts are out of scope. Never overclaim.
    - namespace: clip2trace
      name: evidence-scoring-rubric
      description: Weights and confidence labels for ranking source candidates.
      content: |
        See skills/evidence-scoring-rubric.md. Weights: visual 0.40, handle 0.15,
        ocr/caption 0.15, predates-input 0.15, temporal 0.05, channel 0.05,
        forward 0.05. Labels: >=0.85 very_strong, >=0.70 strong, >=0.50 plausible,
        >=0.30 weak, <0.30 reject.
    - namespace: clip2trace
      name: report-style
      description: Cautious, evidence-backed provenance report writing style.
      content: |
        See skills/report-style.md. Use "candidate", "likely", "evidence
        suggests". Never "confirmed original" in automated output.

  agents:
    - namespace: clip2trace
      name: coordinator
      description: Orchestrates source tracing for one input video, evidence-first and cautious.
      llmProviderName: "${{ vars.PRIMARY_LLM }}"
      model: claude-sonnet-4-6
      temperature: 0.2
      systemPrompt: |
        See agents/coordinator.md. Orchestrate the pipeline and never claim an
        original source — only likely candidates with caveats. DEMO MODE: when the
        user asks for demo mode (or gives no input video), do NOT ask for a file —
        immediately call create_job(mode="demo") and run the pipeline; the
        functions return the bundled demo fixtures (segments + cached Telegram
        candidates), so produce the full provenance report without any upload. Only
        request an input video for live/hybrid runs that need real footage. When
        calling verify_media_similarity, you MUST pass segment_phashes (the
        segment's phashes), candidate_phashes (the candidate's phashes),
        segment_text (the segment's ocr_text), candidate_text (the candidate's
        caption), and segment_duration/candidate_duration from the timecodes —
        otherwise the visual score is 0 and every candidate is wrongly rejected.
        PERSIST job state to
        the clip2trace/jobs store (key = job_id): write the status on each step
        (created -> analyzing -> searching -> verifying -> ranking -> reporting ->
        done), and on failure set status=failed with the error message. Persist
        segments to clip2trace/segments, search hits to clip2trace/search-results,
        and media matches to clip2trace/candidate-matches as they are produced.
        (Functions are pure transforms — they return data; you hold the store
        access and are responsible for persistence.)
      enabledFunctions:
        - clip2trace/create_job
        - clip2trace/analyze_input_video
        - clip2trace/search_global_telegram_posts
        - clip2trace/fetch_telegram_candidate_media
        - clip2trace/verify_media_similarity
        - clip2trace/rank_source_candidates
        - clip2trace/render_report
      enabledSkills:
        - { skill: clip2trace/telegram-source-tracing, preload: true }
        - { skill: clip2trace/report-style, preload: true }
      enabledStores:
        - { store: clip2trace/jobs, access: readwrite }
        - { store: clip2trace/segments, access: readwrite }
        - { store: clip2trace/search-results, access: readwrite }
        - { store: clip2trace/candidate-matches, access: readwrite }
    - namespace: clip2trace
      name: source-segment-analyst
      description: Classifies segment type and outputs source likelihood + search clues.
      llmProviderName: "${{ vars.PRIMARY_LLM }}"
      model: claude-sonnet-4-6
      temperature: 0.2
      systemPrompt: |
        See agents/source-segment-analyst.md. Detect candidate segments and extract
        clues, then PERSIST each segment with its clues (visible_handles, ocr_text,
        context_terms, phashes) to the clip2trace/segments store, keyed by
        segment_id, so later steps and the dashboard can read them.
      enabledFunctions:
        - clip2trace/detect_source_segments
        - clip2trace/extract_segment_clues
      enabledStores:
        - { store: clip2trace/segments, access: readwrite }
    - namespace: clip2trace
      name: telegram-query-planner
      description: Converts clues into a small ranked global Telegram query set.
      llmProviderName: "${{ vars.PRIMARY_LLM }}"
      model: claude-sonnet-4-6
      temperature: 0.2
      systemPrompt: |
        See agents/telegram-query-planner.md.
      enabledFunctions:
        - clip2trace/generate_telegram_queries
      enabledSkills:
        - { skill: clip2trace/telegram-source-tracing, preload: true }
      enabledStores:
        - { store: clip2trace/query-cache, access: readwrite }
    - namespace: clip2trace
      name: evidence-ranker
      description: Scores candidates with the rubric and always includes caveats.
      llmProviderName: "${{ vars.PRIMARY_LLM }}"
      model: claude-sonnet-4-6
      temperature: 0.1
      systemPrompt: |
        See agents/evidence-ranker.md.
      enabledFunctions:
        - clip2trace/verify_media_similarity
        - clip2trace/rank_source_candidates
      enabledSkills:
        - { skill: clip2trace/evidence-scoring-rubric, preload: true }
      enabledStores:
        - { store: clip2trace/candidate-matches, access: readwrite }
    - namespace: clip2trace
      name: report-writer
      description: Writes a cautious provenance report for human verification.
      llmProviderName: "${{ vars.PRIMARY_LLM }}"
      model: claude-sonnet-4-6
      temperature: 0.2
      systemPrompt: |
        See agents/report-writer.md. Render the provenance report (cautious
        language; never "original"). SAVE the report JSON to the clip2trace/reports
        collection (metadata: job_id) and set the job's status to "done" in the
        clip2trace/jobs store.
      enabledFunctions:
        - clip2trace/render_report
      enabledSkills:
        - { skill: clip2trace/report-style, preload: true }
      enabledStores:
        - { store: clip2trace/jobs, access: readwrite }
      enabledCollections:
        - { collection: clip2trace/reports, access: readwrite }

  components:
    - namespace: clip2trace
      name: dashboard
      title: clip2trace
      visibility: shared
      enabledFunctions:
        - clip2trace/create_job
        - clip2trace/render_report
      enabledStores:
        - { store: clip2trace/jobs, access: readonly }
      sourceCode: |
        // Skeleton — full source in components/dashboard.jsx.
        export default function Dashboard() {
          return <div>clip2trace — see components/dashboard.jsx</div>;
        }

  manifests:
    - namespace: clip2trace
      name: clip2trace
      description: Manifest for clip2trace — Telegram source tracing for reused footage.
      requiredResources:
        - { type: function, namespace: clip2trace, name: create_job }
        - { type: function, namespace: clip2trace, name: diagnose_runtime }
        - { type: function, namespace: clip2trace, name: analyze_input_video }
        - { type: function, namespace: clip2trace, name: detect_source_segments }
        - { type: function, namespace: clip2trace, name: extract_segment_clues }
        - { type: function, namespace: clip2trace, name: generate_telegram_queries }
        - { type: function, namespace: clip2trace, name: search_global_telegram_posts }
        - { type: function, namespace: clip2trace, name: fetch_telegram_candidate_media }
        - { type: function, namespace: clip2trace, name: verify_media_similarity }
        - { type: function, namespace: clip2trace, name: rank_source_candidates }
        - { type: function, namespace: clip2trace, name: render_report }
        - { type: agent, namespace: clip2trace, name: coordinator }
        - { type: agent, namespace: clip2trace, name: source-segment-analyst }
        - { type: agent, namespace: clip2trace, name: telegram-query-planner }
        - { type: agent, namespace: clip2trace, name: evidence-ranker }
        - { type: agent, namespace: clip2trace, name: report-writer }
        - { type: skill, namespace: clip2trace, name: telegram-source-tracing }
        - { type: skill, namespace: clip2trace, name: evidence-scoring-rubric }
        - { type: skill, namespace: clip2trace, name: report-style }
        - { type: collection, namespace: clip2trace, name: input-videos }
        - { type: collection, namespace: clip2trace, name: source-segments }
        - { type: collection, namespace: clip2trace, name: keyframes }
        - { type: collection, namespace: clip2trace, name: telegram-media }
        - { type: collection, namespace: clip2trace, name: reports }
        - { type: collection, namespace: clip2trace, name: demo-fixtures }
      # NOTE: manifest requiredResources only supports agent|collection|function|skill
      # (per `sinas validate`). Stores + the dashboard component are declared in
      # spec.stores / spec.components and created at install, but are NOT listed here.
      requiredPermissions:
        - clip2trace.jobs.write:all
        - clip2trace.jobs.read:all
        - clip2trace.reports.read:all
      optionalPermissions:
        - clip2trace.telegram.search:all
      exposedNamespaces: {}
      storeDependencies: []

  dependencies:
    - { packageName: numpy }
    - { packageName: pillow }
    - { packageName: imagehash }
    - { packageName: rapidfuzz }
    - { packageName: python-dateutil }
    - { packageName: requests }
