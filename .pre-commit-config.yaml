# Optional local hooks mirroring CI. Install once: `uvx pre-commit install`.
# Config lives in pyproject.toml ([tool.ruff], [tool.black], [tool.mypy]).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^src/clip2trace/
        args: [--config-file=pyproject.toml]
